name: CI

# PR/merge-group full validation and reusable rolling main validation. Draft PRs skip runners; moving
# a pull request to Ready for Review starts this workflow once the change is ready.

on:
  # Rolling main validation shares every job; PR and merge-group defaults stay intact.
  workflow_call:
    inputs:
      target_sha:
        description: Immutable main snapshot admitted by the rolling controller
        type: string
        default: ''
  # Merge queue entries run the same required check on the queued merge group.
  merge_group:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  # Main pushes use Main Rolling Controller; rollback: scripts/restore-main-push-ci.mjs.
  workflow_dispatch:
    inputs:
      synthetic_failure_artifacts:
        description: Deliberately fail the isolated synthetic artifact fixture (separate validation run)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  # A draft synchronize event can be delivered after ready_for_review. Keep stale
  # draft events in a separate lane so they cannot evict the runnable ready event.
  # Pull-request lanes are per head commit and never cancel in progress: two runs GitHub starts
  # for one head would otherwise cancel each other and leave a cancelled required check on that
  # head (#3283). The pr-ci-supersede workflow cancels runs of older heads instead.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ github.event_name == 'pull_request' && github.event.pull_request.draft && github.event.action != 'ready_for_review' && 'draft' || 'active' }}-${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || 'ref' }}
  cancel-in-progress: ${{ github.event_name != 'pull_request' }}

jobs:
  # Opt-in only. Absent/ordinary off values consume no runner. Case variants admit this job,
  # but the exact shell check below forces full coverage; only lowercase enabled permits fast.
  # Non-PR events never enter selection, including merge groups and rolling validation.
  suite_plan:
    if: github.event_name == 'pull_request' && vars.CI_PR_SUITE_ROUTING == 'enabled' && (github.event.action == 'ready_for_review' || github.event.pull_request.draft == false)
    name: PR Suite Routing
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      mode: ${{ steps.plan.outputs.mode }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - name: Compute Trusted PR Route
        id: plan
        env:
          ROUTING_SWITCH: ${{ vars.CI_PR_SUITE_ROUTING }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          TESTED_SHA: ${{ github.sha }}
          CHANGE_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # A fetch/selector error explicitly chooses full. Setup/job failures remain failures.
          # GitHub expression equality ignores case; only this exact shell match permits fast.
          if [ "$ROUTING_SWITCH" != enabled ]; then
            echo 'mode=full' >> "$GITHUB_OUTPUT"
            echo 'Routing switch is not exactly enabled; full coverage required.'
          elif git fetch --no-tags origin "$TESTED_SHA" "$CHANGE_HEAD_SHA" && test -f scripts/ci-pr-routing.mjs; then
            node scripts/ci-pr-routing.mjs
          else
            echo 'mode=full' >> "$GITHUB_OUTPUT"
            echo 'PR routing unavailable; full coverage required.'
          fi

  # The required status context "Typecheck, Test & Sidecar Bundle" is the `check` job below. It
  # only aggregates: the work runs in parallel jobs with their own time budgets, because the
  # browser end-to-end suite alone takes ~19 minutes and was crowding the single 30-minute job
  # (a merge-queue run that hits the budget is cancelled and the PR silently leaves the queue).
  checks:
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || github.event.action == 'ready_for_review' || github.event.pull_request.draft == false) }}
    needs: suite_plan
    name: Typecheck, Unit Tests & Bundles
    runs-on: ubuntu-24.04
    # Everything except the video decoder install took a median of 539 seconds and at most 771 over
    # 615 successful jobs from 2026-09-28 to 2026-10-01 (Unit Tests alone at most 615). Both install
    # attempts at their seven-minute bounds plus that slowest remainder is just under 27 minutes
    # (#2328), and the package cache's resolve, restore, verify, collect and save steps add at most
    # eight more (#2345), so thirty-five still leaves the unit tests their full run time when every
    # one of those steps runs to its bound. The contract test keeps this budget above the bounds of
    # all of the decoder steps plus that remainder.
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.target_sha }}

      - name: Verify Rolling Checkout
        if: inputs.target_sha != ''
        env:
          EXPECTED_SHA: ${{ inputs.target_sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Setup Node 24
        id: setup_node_24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        continue-on-error: true
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Retry Setup Node 24
        if: ${{ !cancelled() && steps.setup_node_24.outcome == 'failure' }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      # FFmpeg brings 73 packages (46.7 MB) from the Ubuntu mirror. Across 615 successful jobs from
      # 2026-09-28 to 2026-10-01 this took a median of 26 seconds and a p99 of 413, the slowest 607,
      # but on 2026-10-01 a slow yet moving mirror (58-84 kB/s) stretched it to 9-20 minutes and the
      # job budget cancelled Unit Tests in five merge groups with no test failing (#2328). Each
      # attempt is bounded on its own. A step timeout signals only the step's shell, so a timed-out
      # attempt's root apt processes keep running and holding the apt and dpkg locks; the retry kills
      # them and finishes any interrupted dpkg run before installing again. apt keeps every package
      # the first attempt finished downloading, so the two attempts' fetch time adds up: fourteen
      # minutes covers 46.7 MB at about 60 kB/s. When the retry fails too, the job fails here with an
      # error naming this install, not as a cancelled Unit Tests run.
      #
      # A mirror that stayed under that rate for hours still failed both attempts, so the packages
      # are cached (#2345). After an index update (8.6 seconds even on the slow day), apt prints the
      # exact archives the install would fetch on this image. The key hashes their names, versions,
      # sizes and checksums with the runner image, so a new image or any new package version misses
      # and is fetched and cached again. On a hit the first attempt installs with --no-download,
      # which fails rather than touch the mirror if anything is missing, and the retry then fetches
      # as before. The cache steps cannot fail the job: each continues on error, and a resolve or
      # restore that fails, times out or misses falls back to the two bounded attempts. A resolve
      # that timed out leaves its root apt-get holding the lists lock, so a miss clears it first.
      # Main saves what pull requests and merge groups restore, right after the install so a later
      # test failure or a cancelled main run still keeps it. The Playwright installs in the browser
      # job are not cached: Playwright owns their package list, and their 18.4 MB of archives fits
      # both six-minute attempts down to about 26 kB/s.
      - name: Resolve Isolated Video Decoder Packages
        id: video-decoder-packages
        continue-on-error: true
        timeout-minutes: 2
        run: |
          : "${ImageOS:?}" "${ImageVersion:?}"
          sudo apt-get update -qq
          archives="$(sudo apt-get install -qq --print-uris --no-install-recommends bubblewrap ffmpeg)"
          test -n "$archives"
          printf '%s\n' "$archives" > "$RUNNER_TEMP/video-decoder-packages.txt"
          digest="$(cut -d ' ' -f 2- "$RUNNER_TEMP/video-decoder-packages.txt" | sort | sha256sum | cut -c 1-64)"
          echo "key=video-decoder-$ImageOS-$ImageVersion-$digest" >> "$GITHUB_OUTPUT"
      - name: Restore Isolated Video Decoder Packages
        id: video-decoder-cache
        if: steps.video-decoder-packages.outputs.key != ''
        continue-on-error: true
        timeout-minutes: 2
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/video-decoder-packages
          key: ${{ steps.video-decoder-packages.outputs.key }}
      - name: Install Isolated Video Decoder for Unit Tests
        id: video-decoder
        continue-on-error: true
        timeout-minutes: 7
        env:
          CACHE_HIT: ${{ steps.video-decoder-cache.outputs.cache-hit }}
        run: |
          if [ "$CACHE_HIT" = true ]; then
            sudo cp ~/.cache/video-decoder-packages/*.deb /var/cache/apt/archives/
            sudo apt-get install -y --no-install-recommends --no-download bubblewrap ffmpeg
          else
            sudo pkill -KILL -x apt-get || true
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends bubblewrap ffmpeg
          fi
      - name: Retry Install Isolated Video Decoder for Unit Tests
        if: ${{ !cancelled() && steps.video-decoder.outcome == 'failure' }}
        timeout-minutes: 7
        run: |
          trap 'echo "::error::Install Isolated Video Decoder for Unit Tests failed on both attempts, so the unit tests did not run"' ERR
          sudo pkill -KILL -x 'apt-get|dpkg' || true
          sudo dpkg --configure -a
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends bubblewrap ffmpeg
      - name: Verify Isolated Video Decoder for Unit Tests
        timeout-minutes: 1
        run: |
          bash scripts/configure-ci-bubblewrap.sh
          bwrap --version
          ffmpeg -hide_banner -version
      # Only the archives the key was computed from, so a hit restores exactly that set.
      - name: Collect Isolated Video Decoder Packages
        id: video-decoder-collect
        if: steps.video-decoder-packages.outputs.key != '' && steps.video-decoder-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        timeout-minutes: 1
        run: |
          rm -rf ~/.cache/video-decoder-packages
          mkdir -p ~/.cache/video-decoder-packages
          while read -r _ archive _; do
            cp "/var/cache/apt/archives/$archive" ~/.cache/video-decoder-packages/
          done < "$RUNNER_TEMP/video-decoder-packages.txt"
      - name: Save Isolated Video Decoder Packages
        if: steps.video-decoder-collect.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 2
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/video-decoder-packages
          key: ${{ steps.video-decoder-packages.outputs.key }}

      - name: Provision Engine Boundary Package Managers
        shell: bash
        run: |
          package_manager="$(node -p 'require("./package.json").packageManager')"
          npm install --prefix "$RUNNER_TEMP/engine-pnpm-10" --ignore-scripts --no-audit --no-fund --package-lock=false pnpm@10.11.0
          npm install --prefix "$RUNNER_TEMP/engine-pnpm-current" --ignore-scripts --no-audit --no-fund --package-lock=false "$package_manager"

      - name: Setup Minimum Node 22
        id: setup_node_22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        continue-on-error: true
        with:
          node-version: 22.13.0
      - name: Retry Setup Minimum Node 22
        if: ${{ !cancelled() && steps.setup_node_22.outcome == 'failure' }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.13.0
      - name: Verify Node 22 Engine Boundary
        run: node scripts/check-node-engines.mjs "$RUNNER_TEMP/engine-pnpm-10/node_modules/pnpm/bin/pnpm.cjs" "$RUNNER_TEMP/engine-pnpm-current/node_modules/pnpm/bin/pnpm.cjs"

      - name: Setup Excluded Node 23
        id: setup_excluded_node_23
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        continue-on-error: true
        with:
          node-version: 23.2.0
      - name: Retry Setup Excluded Node 23
        if: ${{ !cancelled() && steps.setup_excluded_node_23.outcome == 'failure' }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 23.2.0
      - name: Verify Excluded Node Engine Boundary
        run: node scripts/check-node-engines.mjs "$RUNNER_TEMP/engine-pnpm-10/node_modules/pnpm/bin/pnpm.cjs" "$RUNNER_TEMP/engine-pnpm-current/node_modules/pnpm/bin/pnpm.cjs"

      - name: Setup Minimum Node 23
        id: setup_node_23
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        continue-on-error: true
        with:
          node-version: 23.4.0
      - name: Retry Setup Minimum Node 23
        if: ${{ !cancelled() && steps.setup_node_23.outcome == 'failure' }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 23.4.0
      - name: Verify Node 23 Engine Boundary
        run: node scripts/check-node-engines.mjs "$RUNNER_TEMP/engine-pnpm-10/node_modules/pnpm/bin/pnpm.cjs" "$RUNNER_TEMP/engine-pnpm-current/node_modules/pnpm/bin/pnpm.cjs"

      - name: Restore Node 24
        id: restore_node_24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        continue-on-error: true
        with:
          node-version-file: .nvmrc
      - name: Retry Restore Node 24
        if: ${{ !cancelled() && steps.restore_node_24.outcome == 'failure' }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - name: Verify Recommended Node Engine Boundary
        run: node scripts/check-node-engines.mjs "$RUNNER_TEMP/engine-pnpm-10/node_modules/pnpm/bin/pnpm.cjs" "$RUNNER_TEMP/engine-pnpm-current/node_modules/pnpm/bin/pnpm.cjs"

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit Tests
        env:
          ROUTING_SWITCH: ${{ vars.CI_PR_SUITE_ROUTING }}
          PR_FAST: ${{ github.event_name == 'pull_request' && vars.CI_PR_SUITE_ROUTING == 'enabled' && needs.suite_plan.outputs.mode == 'fast' && 'true' || 'false' }}
        run: |
          if [ "$PR_FAST" = true ] && [ "$ROUTING_SWITCH" = enabled ]; then
            node scripts/test-suites.mjs --node-only --groups node-fast --ci
          else
            pnpm test:ci
          fi

      - name: Verify Delegated Linux Provider Containment
        timeout-minutes: 3
        shell: bash
        run: |
          set -euo pipefail
          containment_root="$(mktemp -d "$RUNNER_TEMP/wollipog-cgroup.XXXXXX")"
          trap 'rm -rf "$containment_root"' EXIT
          mkdir -p "$containment_root/home" "$containment_root/tmp" "$containment_root/cache"
          # A transient test service explicitly delegates its subtree to the ordinary test user.
          # RuntimeMaxSec also cleans up if the client or CI step is cancelled.
          sudo systemd-run --wait --collect --pipe \
            --property=Delegate=yes --property=RuntimeMaxSec=75 --property=TimeoutStopSec=5 \
            --uid="$(id -u)" --gid="$(id -g)" --working-directory="$PWD" \
            /usr/bin/env PATH="$PATH" HOME="$containment_root/home" TMPDIR="$containment_root/tmp" \
            XDG_CACHE_HOME="$containment_root/cache" WOLLIPOG_TEST_REQUIRE_CGROUP=1 \
            "$(command -v node)" --import tsx --test --test-timeout=60000 apps/runner/src/linux-cgroup.test.ts
          # User managers on systemd 255 do not set user.delegate. Exercise their authoritative
          # Delegate/ControlGroup query too, instead of only testing the system-manager marker.
          # The suite hides only the marker probe for initialization and requires a real query,
          # so a future user manager adding the marker cannot silently remove this coverage.
          # Start only this ephemeral CI user's manager; no lingering or persistent unit changes.
          sudo systemctl start "user@$(id -u).service"
          XDG_RUNTIME_DIR="/run/user/$(id -u)" systemd-run --user --wait --collect --pipe \
            --property=Delegate=yes --property=RuntimeMaxSec=75 --property=TimeoutStopSec=5 \
            --working-directory="$PWD" \
            /usr/bin/env PATH="$PATH" HOME="$containment_root/home" TMPDIR="$containment_root/tmp" \
            XDG_CACHE_HOME="$containment_root/cache" XDG_RUNTIME_DIR="/run/user/$(id -u)" \
            WOLLIPOG_TEST_REQUIRE_CGROUP=1 WOLLIPOG_TEST_EXPECT_USER_MANAGER_QUERY=1 \
            "$(command -v node)" --import tsx --test --test-timeout=60000 apps/runner/src/linux-cgroup.test.ts

      - name: Validate Web Production Build
        run: pnpm --filter @wollipog/web build

      - name: Validate Runner Bundle
        run: pnpm --filter @wollipog/runner exec node scripts/build-binary.mjs --bundle-only

      # esbuild-only pass (build-sidecar.mjs --bundle-only): proves the control plane and
      # its deps still bundle into one CJS file. Skips the SEA/postject/Tauri steps, so no
      # rustc or target triple is needed here.
      - name: Validate Control-Plane Bundle
        run: pnpm --filter @wollipog/desktop exec node scripts/build-sidecar.mjs --bundle-only

  browser:
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || github.event.action == 'ready_for_review' || github.event.pull_request.draft == false) }}
    needs: suite_plan
    name: Browser End-to-End Tests
    runs-on: ubuntu-24.04
    # A recovered install timeout plus passing tests exhausted the old budget (#2700).
    # Remeasured 2026-10-18: 25 jobs across five recent natural main/merge-group runs,
    # Runs: 39135469681, 39138757428, 39141574932, 39142428503, 39142667230.
    # Per-shard non-install maxima (1–5): 1731 / 1731 / 1585 / 1910 / 2016s.
    # Maximum non-install remainder: 2016s (previous envelope: 1448s),
    # including other setup, suite, shard-1 production checks and cleanup; queue wait excluded.
    # Cache-hit OR cache-miss path: two six-minute attempts, not both exclusive paths.
    # #3628 projects 1710s; retain the measured 2020s floor pending redistributed natural runs.
    # 720s attempts + max(2020s, 1710s) remainder + 105s enforcement + 480s failure diagnostics
    # + 180s reserve = 3505s before the system-package cache. Its five bounded phases add
    # 480s + 75s enforcement (#3649): 4060s fits a finite 68m (4080s), with 200s residual.
    # Same five concurrent browser jobs. Hung jobs can hold runners 9m longer than the
    # prior 59m limit in the shared 20-job pool; cache hits should shorten normal setup.
    # scripts/workflow-browser-budget.test.mjs derives this from actual step deadlines and
    # identified phases. Remeasure after workload/setup changes; do not grow blindly.
    # docs/ci-browser-budget.md records warm/cold-cache uncertainty and natural-run delivery.
    timeout-minutes: 68
    strategy:
      # Every shard reports. With fail-fast the first real failure cancels its siblings, and the
      # aggregator below reads a cancelled job as a budget hit — so one broken test would be
      # announced as four timeouts, which is the opposite of a useful signal.
      fail-fast: false
      matrix:
        # Projects partition the live file inventory by measured duration, keeping files intact.
        # The inventory contract pins these five jobs to all five projects and compares every
        # configured test identity with the unpartitioned development inventory.
        shard: ${{ fromJSON(github.event_name == 'pull_request' && vars.CI_PR_SUITE_ROUTING == 'enabled' && needs.suite_plan.outputs.mode == 'fast' && '[1]' || '[1, 2, 3, 4, 5]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.target_sha }}

      - name: Verify Rolling Checkout
        if: inputs.target_sha != ''
        env:
          EXPECTED_SHA: ${{ inputs.target_sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Setup Node 24
        id: setup_node_24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        continue-on-error: true
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Retry Setup Node 24
        if: ${{ !cancelled() && steps.setup_node_24.outcome == 'failure' }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Resolve Playwright Version
        id: playwright-version
        run: |
          playwright_version="$(pnpm exec playwright --version)"
          echo "version=${playwright_version#Version }" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright Browser
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.playwright-version.outputs.version }}

      # Cache Playwright's exact resolved archives as in #2345 (#3649). Keys follow the image,
      # Playwright version and archive names/sizes/checksums. Optional cache failures use #2123's
      # bounded install and retry; a broken offline install enters the network-enabled retry.
      - name: Resolve Playwright Chromium System Packages
        id: playwright-chromium-packages-resolve
        continue-on-error: true
        timeout-minutes: 2
        env:
          PLAYWRIGHT_VERSION: ${{ steps.playwright-version.outputs.version }}
        run: bash scripts/playwright-system-packages.sh resolve chromium
      - name: Restore Playwright Chromium System Packages
        id: playwright-chromium-packages-cache
        if: steps.playwright-chromium-packages-resolve.outputs.key != ''
        continue-on-error: true
        timeout-minutes: 2
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/playwright-chromium-packages
          key: ${{ steps.playwright-chromium-packages-resolve.outputs.key }}
      - name: Install Playwright Browser
        id: playwright-browser
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        timeout-minutes: 6
        env:
          SYSTEM_CACHE_HIT: ${{ steps.playwright-chromium-packages-cache.outcome == 'success' && steps.playwright-chromium-packages-cache.outputs.cache-hit || 'false' }}
        run: bash scripts/playwright-system-packages.sh install chromium browser
      - name: Retry Install Playwright Browser
        if: ${{ !cancelled() && steps.playwright-browser.outcome == 'failure' }}
        timeout-minutes: 6
        run: |
          pkill -KILL -f 'playwright[^ ]* install' || true
          sudo pkill -KILL -x 'apt-get|dpkg' || true
          sudo dpkg --configure -a
          pnpm exec playwright install --with-deps chromium

      - name: Install Playwright System Dependencies
        id: playwright-system-dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        continue-on-error: true
        timeout-minutes: 6
        env:
          SYSTEM_CACHE_HIT: ${{ steps.playwright-chromium-packages-cache.outcome == 'success' && steps.playwright-chromium-packages-cache.outputs.cache-hit || 'false' }}
        run: bash scripts/playwright-system-packages.sh install chromium system
      - name: Retry Install Playwright System Dependencies
        if: ${{ !cancelled() && steps.playwright-system-dependencies.outcome == 'failure' }}
        timeout-minutes: 6
        run: |
          pkill -KILL -f 'playwright[^ ]* install' || true
          sudo pkill -KILL -x 'apt-get|dpkg' || true
          sudo dpkg --configure -a
          pnpm exec playwright install-deps chromium

      - name: Verify Playwright Chromium Launch
        timeout-minutes: 1
        run: node scripts/verify-playwright-browser.mjs chromium
      - name: Collect Playwright Chromium System Packages
        id: playwright-chromium-packages-collect
        if: steps.playwright-chromium-packages-resolve.outputs.key != '' && (steps.playwright-chromium-packages-cache.outcome != 'success' || steps.playwright-chromium-packages-cache.outputs.cache-hit != 'true')
        continue-on-error: true
        timeout-minutes: 1
        run: bash scripts/playwright-system-packages.sh collect chromium
      - name: Save Playwright Chromium System Packages
        if: steps.playwright-chromium-packages-collect.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 2
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/playwright-chromium-packages
          key: ${{ steps.playwright-chromium-packages-resolve.outputs.key }}

      - name: Remote-Instance Browser End-to-End Tests
        id: browser-tests
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: ${{ runner.temp }}/synthetic-browser-report.json
          SYNTHETIC_ARTIFACT_FAILURE: ${{ github.event_name == 'workflow_dispatch' && inputs.synthetic_failure_artifacts && 'true' || 'false' }}
          ROUTING_SWITCH: ${{ vars.CI_PR_SUITE_ROUTING }}
          PR_FAST: ${{ github.event_name == 'pull_request' && vars.CI_PR_SUITE_ROUTING == 'enabled' && needs.suite_plan.outputs.mode == 'fast' && 'true' || 'false' }}
        run: |
          if [ "$PR_FAST" = true ] && [ "$ROUTING_SWITCH" = enabled ]; then
            pnpm test:e2e authentication-recovery.spec.ts new-session-choices.spec.ts request-surfaces.spec.ts issue-closure.spec.ts conversation-handoff.spec.ts
          else
            pnpm test:e2e --config playwright.ci.config.ts --project=shard-${{ matrix.shard }}
          fi

      # Upload only projected allowlisted captures from this failed shard. The original test step
      # is never continued-on-error: missing captures, sanitizer failure and upload failure cannot
      # turn its job or required aggregate green. No raw report/results directory is uploaded.
      - name: Sanitize Synthetic Browser Failure Artifacts
        id: sanitize-browser-artifacts
        if: ${{ !cancelled() && steps.browser-tests.outcome == 'failure' }}
        continue-on-error: true
        timeout-minutes: 1
        env:
          CI_EVIDENCE_HEAD: ${{ inputs.target_sha || github.event.pull_request.head.sha || github.sha }}
        run: >-
          python3 scripts/sanitize-browser-failure-artifacts.py
          --report "${{ runner.temp }}/synthetic-browser-report.json"
          --results test-results
          --output "${{ runner.temp }}/sanitized-synthetic-browser"
          --outcome failure
          --run-id "${{ github.run_id }}" --attempt "${{ github.run_attempt }}"
          --shard "${{ matrix.shard }}"
          --head "$CI_EVIDENCE_HEAD"

      - name: Upload Sanitized Synthetic Browser Failure Artifacts
        if: ${{ !cancelled() && steps.browser-tests.outcome == 'failure' && steps.sanitize-browser-artifacts.outcome == 'success' && steps.sanitize-browser-artifacts.outputs.retained == 'true' }}
        continue-on-error: true
        timeout-minutes: 1
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: synthetic-browser-failure-${{ github.run_id }}-${{ github.run_attempt }}-shard-${{ matrix.shard }}
          path: |
            ${{ runner.temp }}/sanitized-synthetic-browser/manifest.json
            ${{ runner.temp }}/sanitized-synthetic-browser/synthetic-failure-*/trace.zip
            ${{ runner.temp }}/sanitized-synthetic-browser/synthetic-failure-*/error-context.md
          retention-days: 3
          if-no-files-found: error
          include-hidden-files: false

      # No machine outside CI renders the linux settings-rows baselines closely enough to commit
      # (#3215), so when this shard's settings-rows tests failed, regenerate the linux images that
      # differ and upload exactly those, as the win32 job does. Playwright shards by file, so one
      # shard owns the spec. These steps come after the sanitized upload because Playwright empties
      # test-results when it starts. Like those, they cannot turn the failed suite step, its job or
      # the required aggregate green; they only turn the failure into the files that fix it.
      - name: Regenerate the Changed linux Settings-Rows Baselines
        id: linux-baselines
        if: ${{ !cancelled() && steps.browser-tests.outcome == 'failure' }}
        continue-on-error: true
        timeout-minutes: 4
        env:
          REPORT: ${{ runner.temp }}/synthetic-browser-report.json
        run: |
          set -euo pipefail
          # A report that cannot be read regenerates rather than skips.
          failed="$(node -e '
            const report = JSON.parse(require("node:fs").readFileSync(process.argv[1], "utf8"));
            const spec = /(^|\/)settings-rows\.spec\.ts$/;
            const failed = (suite) =>
              (suite.specs ?? []).some((s) => spec.test(s.file) && s.tests.some((t) => t.status === "unexpected" || t.status === "flaky"))
              || (suite.suites ?? []).some(failed);
            process.stdout.write(String((report.suites ?? []).some(failed)));
          ' "$REPORT" || echo unknown)"
          if [[ "$failed" == false ]]; then
            echo "No settings-rows test failed on this shard, so its linux baselines are not regenerated."
            echo "state=unaffected" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          status=0
          pnpm exec playwright test settings-rows --update-snapshots=changed || status=$?
          echo "The regeneration run exited with $status."
          staging="$RUNNER_TEMP/settings-rows-linux-baselines"
          list="$RUNNER_TEMP/settings-rows-linux-regenerated.txt"
          rm -rf "$staging"
          mkdir -p "$staging"
          # Modified and newly written linux images alike, nothing else; the repository-relative
          # path is kept so the artifact extracts over a checkout at the right place.
          git status --porcelain --untracked-files=all -- 'apps/web/e2e/settings-rows.spec.ts-snapshots/*-linux.png' \
            | cut -c4- > "$list"
          while IFS= read -r file; do
            mkdir -p "$staging/$(dirname "$file")"
            cp "$file" "$staging/$file"
          done < "$list"
          {
            echo "state=regenerated"
            echo "count=$(wc -l < "$list" | tr -d ' ')"
            echo "staging=$staging"
            echo "list=$list"
          } >> "$GITHUB_OUTPUT"

      - name: Upload the Regenerated linux Settings-Rows Baselines
        id: linux-baselines-upload
        if: ${{ !cancelled() && steps.browser-tests.outcome == 'failure' && steps.linux-baselines.outputs.count != '' && steps.linux-baselines.outputs.count != '0' }}
        continue-on-error: true
        timeout-minutes: 1
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: settings-rows-linux-baselines
          path: ${{ steps.linux-baselines.outputs.staging }}
          # A re-run job is another attempt of the same run, where an earlier attempt's upload may
          # already hold this name; without overwrite the re-run could not publish its images.
          overwrite: true
          if-no-files-found: error
          include-hidden-files: false
          retention-days: 14

      - name: Tell the Author How to Commit the linux Baselines
        if: ${{ !cancelled() && steps.browser-tests.outcome == 'failure' && steps.linux-baselines.outcome != 'skipped' && steps.linux-baselines.outputs.state != 'unaffected' }}
        continue-on-error: true
        timeout-minutes: 1
        env:
          REGENERATE: ${{ steps.linux-baselines.outcome }}
          COUNT: ${{ steps.linux-baselines.outputs.count }}
          LIST: ${{ steps.linux-baselines.outputs.list }}
          UPLOAD: ${{ steps.linux-baselines-upload.outcome }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          {
            if [[ "$REGENERATE" != success ]]; then
              echo "## The linux Settings-Rows Baselines Could Not Be Regenerated"
              echo
              echo "A settings-rows test failed on this shard, but regenerating its linux baselines did not finish. Read the step log above."
            elif [[ "$COUNT" == 0 ]]; then
              echo "## The linux Settings-Rows Comparison Failed Without a Baseline Difference"
              echo
              echo "Regenerating changed no \`*-linux.png\` file, so this is not baseline drift. Read the test log above."
            elif [[ "$UPLOAD" != success ]]; then
              echo "## The Regenerated linux Settings-Rows Baselines Were Not Uploaded"
              echo
              echo "This run regenerated $COUNT linux baselines that differ, but uploading them failed. Re-run this job to try again."
            else
              echo "## The linux Settings-Rows Baselines Are Stale"
              echo
              echo "CI no longer renders what the committed \`*-linux.png\` baselines show. This run regenerated the $COUNT that differ and uploaded them as the \`settings-rows-linux-baselines\` artifact. \`gh run download\` refuses to overwrite the stale images, so download them to a temporary directory and copy that over the checkout. From the repository root, on this branch:"
              echo
              echo '```sh'
              echo 'dir="$(mktemp -d)"'
              echo "gh run download $RUN_ID --repo $REPOSITORY --name settings-rows-linux-baselines --dir \"\$dir\""
              echo 'cp -R "$dir"/. . && rm -rf "$dir"'
              echo "git add apps/web/e2e/settings-rows.spec.ts-snapshots"
              echo "git commit -m \"Regenerate the linux settings-rows baselines\""
              echo '```'
              echo
              echo "Or download the artifact from this run's summary page and extract it at the repository root. Look at each image before committing it: it should show the change you meant to make. The win32 job regenerates its own set once these are committed."
            fi
            if [[ -n "$LIST" && -s "$LIST" ]]; then
              echo
              sed 's/^/- `/; s/$/`/' "$LIST"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          if [[ "$REGENERATE" == success && "$COUNT" != 0 && "$UPLOAD" == success ]]; then
            echo "::error title=Stale linux Baselines::$COUNT linux settings-rows baselines differ from what CI renders. The regenerated images are in this run's settings-rows-linux-baselines artifact; the job summary says how to commit them."
          fi

      # Production build/smoke remains shard-1-only. Its measured cost is preloaded into the
      # duration grouping so the complete shard path, including this work, is balanced.
      - name: Validate Web Production Build
        if: matrix.shard == 1
        run: pnpm --filter @wollipog/web build

      - name: Rendered Production Browser Smoke
        if: matrix.shard == 1
        run: pnpm test:e2e:production

      # esbuild-only pass (build-binary.mjs --bundle-only): proves the runner and its
      # dependencies still bundle into one CJS file. Skips SEA/postject packaging, so no
      # rustc or target triple is needed here.

  # The win32 settings-rows baselines, which the Ubuntu browser job above cannot see. The called
  # workflow compares on Windows only when the diff touches that spec or its baselines, and reports
  # success otherwise; when it fails, its summary and artifact carry the regenerated images.
  win32:
    if: github.event_name != 'pull_request' || github.event.action == 'ready_for_review' || github.event.pull_request.draft == false
    name: Settings-Rows win32 Baselines
    uses: ./.github/workflows/settings-rows-win32.yml
    with:
      ref: ${{ inputs.target_sha }}
      expected_sha: ${{ inputs.target_sha }}

  # The specs that opt into WebKit (playwright.webkit.config.ts), which is Safari's engine and both
  # desktop webviews'. It is its own job, beside the Chromium shards rather than inside one, so it
  # adds no time to the browser job's budget (#2700); it installs only WebKit and its packages.
  # Budget: one install path's two six-minute attempts, plus a remainder of setup, the dev server and
  # the specs that took under four minutes when measured (#3214), plus reserve.
  webkit:
    if: github.event_name != 'pull_request' || github.event.action == 'ready_for_review' || github.event.pull_request.draft == false
    name: WebKit End-to-End Tests
    runs-on: ubuntu-24.04
    # Two 6m attempts + 8m cache/verify bounds + 1m45s enforcement + 4m remainder
    # + 3m reserve = 28m45s. The derived cache allowance raises 20m to 29m (#3649).
    timeout-minutes: 29
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.target_sha }}

      - name: Verify Rolling Checkout
        if: inputs.target_sha != ''
        env:
          EXPECTED_SHA: ${{ inputs.target_sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Setup Node 24
        id: setup_node_24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        continue-on-error: true
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Retry Setup Node 24
        if: ${{ !cancelled() && steps.setup_node_24.outcome == 'failure' }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Resolve Playwright Version
        id: playwright-version
        run: |
          playwright_version="$(pnpm exec playwright --version)"
          echo "version=${playwright_version#Version }" >> "$GITHUB_OUTPUT"

      # Its own key: the browser job's cache holds only Chromium under the same directory.
      - name: Cache Playwright WebKit
        id: playwright-webkit-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-webkit-${{ steps.playwright-version.outputs.version }}

      # Cache Playwright's exact resolved archives as in #2345 (#3649). Keys follow the image,
      # Playwright version and archive names/sizes/checksums. Optional cache failures use #2123's
      # bounded install and retry; a broken offline install enters the network-enabled retry.
      - name: Resolve Playwright WebKit System Packages
        id: playwright-webkit-packages-resolve
        continue-on-error: true
        timeout-minutes: 2
        env:
          PLAYWRIGHT_VERSION: ${{ steps.playwright-version.outputs.version }}
        run: bash scripts/playwright-system-packages.sh resolve webkit
      - name: Restore Playwright WebKit System Packages
        id: playwright-webkit-packages-cache
        if: steps.playwright-webkit-packages-resolve.outputs.key != ''
        continue-on-error: true
        timeout-minutes: 2
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/playwright-webkit-packages
          key: ${{ steps.playwright-webkit-packages-resolve.outputs.key }}
      - name: Install Playwright WebKit
        id: playwright-webkit
        if: steps.playwright-webkit-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        timeout-minutes: 6
        env:
          SYSTEM_CACHE_HIT: ${{ steps.playwright-webkit-packages-cache.outcome == 'success' && steps.playwright-webkit-packages-cache.outputs.cache-hit || 'false' }}
        run: bash scripts/playwright-system-packages.sh install webkit browser
      - name: Retry Install Playwright WebKit
        if: ${{ !cancelled() && steps.playwright-webkit.outcome == 'failure' }}
        timeout-minutes: 6
        run: |
          pkill -KILL -f 'playwright[^ ]* install' || true
          sudo pkill -KILL -x 'apt-get|dpkg' || true
          sudo dpkg --configure -a
          pnpm exec playwright install --with-deps webkit

      - name: Install Playwright WebKit System Dependencies
        id: playwright-webkit-system-dependencies
        if: steps.playwright-webkit-cache.outputs.cache-hit == 'true'
        continue-on-error: true
        timeout-minutes: 6
        env:
          SYSTEM_CACHE_HIT: ${{ steps.playwright-webkit-packages-cache.outcome == 'success' && steps.playwright-webkit-packages-cache.outputs.cache-hit || 'false' }}
        run: bash scripts/playwright-system-packages.sh install webkit system
      - name: Retry Install Playwright WebKit System Dependencies
        if: ${{ !cancelled() && steps.playwright-webkit-system-dependencies.outcome == 'failure' }}
        timeout-minutes: 6
        run: |
          pkill -KILL -f 'playwright[^ ]* install' || true
          sudo pkill -KILL -x 'apt-get|dpkg' || true
          sudo dpkg --configure -a
          pnpm exec playwright install-deps webkit

      - name: Verify Playwright WebKit Launch
        timeout-minutes: 1
        run: node scripts/verify-playwright-browser.mjs webkit
      - name: Collect Playwright WebKit System Packages
        id: playwright-webkit-packages-collect
        if: steps.playwright-webkit-packages-resolve.outputs.key != '' && (steps.playwright-webkit-packages-cache.outcome != 'success' || steps.playwright-webkit-packages-cache.outputs.cache-hit != 'true')
        continue-on-error: true
        timeout-minutes: 1
        run: bash scripts/playwright-system-packages.sh collect webkit
      - name: Save Playwright WebKit System Packages
        if: steps.playwright-webkit-packages-collect.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 2
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/playwright-webkit-packages
          key: ${{ steps.playwright-webkit-packages-resolve.outputs.key }}

      - name: WebKit Browser End-to-End Tests
        run: pnpm test:e2e:webkit

  # Advisory only: no needs edge into the required aggregator and no test is executed twice.
  # Checkout the event's trusted base; never import the pull request's selector or policy.
  suite-shadow:
    if: (github.event_name == 'merge_group' || github.event_name == 'pull_request') && (github.event_name != 'pull_request' || github.event.action == 'ready_for_review' || github.event.pull_request.draft == false)
    name: Suite Selection Shadow (Advisory)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.merge_group.base_sha || github.event.pull_request.base.sha }}
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - name: Compute Trusted Suite Selection
        env:
          BASE_SHA: ${{ github.event.merge_group.base_sha || github.event.pull_request.base.sha }}
          TESTED_SHA: ${{ github.sha }}
          CHANGE_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          git fetch --no-tags origin "$TESTED_SHA" "$CHANGE_HEAD_SHA"
          if test -f scripts/ci-suite-selection.mjs; then
            node scripts/ci-suite-selection.mjs --base "$BASE_SHA" --head "$TESTED_SHA" --change-head "$CHANGE_HEAD_SHA"
          else
            echo 'Trusted suite policy unavailable at this base; full coverage remains required.'
          fi

  check:
    # Report failed, cancelled or skipped dependencies while PR CI is active. !cancelled()
    # lets superseded PR runs cancel this job (#2452), without changing non-PR aggregation.
    # It is a status function, so no implicit success() suppresses failure reporting.
    # Keep the draft/ready-for-review guard; see docs/ci-aggregation.md for the verification limits.
    if: ${{ (github.event_name != 'pull_request' || !cancelled()) && (github.event_name != 'pull_request' || github.event.action == 'ready_for_review' || github.event.pull_request.draft == false) }}
    name: Typecheck, Test & Sidecar Bundle
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    needs: [checks, browser, win32, webkit, suite_plan]
    steps:
      - name: Require Every Job to Have Succeeded
        env:
          ROUTING_SWITCH: ${{ vars.CI_PR_SUITE_ROUTING }}
          ROUTING_ENABLED: ${{ github.event_name == 'pull_request' && vars.CI_PR_SUITE_ROUTING == 'enabled' && 'true' || 'false' }}
          PLAN_RESULT: ${{ needs.suite_plan.result }}
          PLAN_MODE: ${{ needs.suite_plan.outputs.mode }}
          CHECKS_RESULT: ${{ needs.checks.result }}
          BROWSER_RESULT: ${{ needs.browser.result }}
          WIN32_RESULT: ${{ needs.win32.result }}
          WEBKIT_RESULT: ${{ needs.webkit.result }}
        run: |
          status=0
          report() {
            case "$2" in
              success) echo "$1: success" ;;
              cancelled) echo "::error::$1 was cancelled: it exceeded its timeout-minutes budget or the run was cancelled"; status=1 ;;
              *) echo "::error::$1 ended with result '$2'"; status=1 ;;
            esac
          }
          if [ "$ROUTING_ENABLED" = true ]; then
            report "PR Suite Routing" "$PLAN_RESULT"
            case "$PLAN_MODE" in
              full) ;;
              fast) if [ "$ROUTING_SWITCH" != enabled ]; then
                echo '::error::Fast routing requires the exact lowercase enabled switch'; status=1
              fi ;;
              *) echo "::error::PR Suite Routing returned missing or unknown mode '$PLAN_MODE'"; status=1 ;;
            esac
          elif [ "$ROUTING_ENABLED" != false ] || [ "$PLAN_RESULT" != skipped ] || [ -n "$PLAN_MODE" ]; then
            echo "::error::Unexpected PR Suite Routing admission or output"; status=1
          fi
          report "Typecheck, Unit Tests & Bundles" "$CHECKS_RESULT"
          report "Browser End-to-End Tests" "$BROWSER_RESULT"
          report "Settings-Rows win32 Baselines" "$WIN32_RESULT"
          report "WebKit End-to-End Tests" "$WEBKIT_RESULT"
          exit "$status"
