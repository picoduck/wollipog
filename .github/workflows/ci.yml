name: CI

# Fast PR/main safety net. Draft pull requests do not consume hosted runners; moving
# a pull request to Ready for Review starts this workflow once the change is ready.

on:
  # Merge queue entries run the same required check on the queued merge group.
  merge_group:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A draft synchronize event can be delivered after ready_for_review. Keep stale
  # draft events in a separate lane so they cannot evict the runnable ready event.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ github.event_name == 'pull_request' && github.event.pull_request.draft && github.event.action != 'ready_for_review' && 'draft' || 'active' }}
  cancel-in-progress: true

jobs:
  # The required status context "Typecheck, Test & Sidecar Bundle" is the `check` job below. It
  # only aggregates: the work runs in parallel jobs with their own time budgets, because the
  # browser end-to-end suite alone takes ~19 minutes and was crowding the single 30-minute job
  # (a merge-queue run that hits the budget is cancelled and the PR silently leaves the queue).
  checks:
    if: github.event_name != 'pull_request' || github.event.action == 'ready_for_review' || github.event.pull_request.draft == false
    name: Typecheck, Unit Tests & Bundles
    runs-on: ubuntu-22.04
    # Everything except the video decoder install took a median of 539 seconds and at most 771 over
    # 615 successful jobs from 2026-09-28 to 2026-10-01 (Unit Tests alone at most 615). Both install
    # attempts at their seven-minute bounds plus that slowest remainder is just under 27 minutes
    # (#2328), and the package cache's resolve, restore, verify, collect and save steps add at most
    # eight more (#2345), so thirty-five still leaves the unit tests their full run time when every
    # one of those steps runs to its bound. The contract test keeps this budget above the bounds of
    # all of the decoder steps plus that remainder.
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Setup Node 24
        id: setup_node_24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        continue-on-error: true
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Retry Setup Node 24
        if: ${{ !cancelled() && steps.setup_node_24.outcome == 'failure' }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      # FFmpeg brings 73 packages (46.7 MB) from the Ubuntu mirror. Across 615 successful jobs from
      # 2026-09-28 to 2026-10-01 this took a median of 26 seconds and a p99 of 413, the slowest 607,
      # but on 2026-10-01 a slow yet moving mirror (58-84 kB/s) stretched it to 9-20 minutes and the
      # job budget cancelled Unit Tests in five merge groups with no test failing (#2328). Each
      # attempt is bounded on its own. A step timeout signals only the step's shell, so a timed-out
      # attempt's root apt processes keep running and holding the apt and dpkg locks; the retry kills
      # them and finishes any interrupted dpkg run before installing again. apt keeps every package
      # the first attempt finished downloading, so the two attempts' fetch time adds up: fourteen
      # minutes covers 46.7 MB at about 60 kB/s. When the retry fails too, the job fails here with an
      # error naming this install, not as a cancelled Unit Tests run.
      #
      # A mirror that stayed under that rate for hours still failed both attempts, so the packages
      # are cached (#2345). After an index update (8.6 seconds even on the slow day), apt prints the
      # exact archives the install would fetch on this image. The key hashes their names, versions,
      # sizes and checksums with the runner image, so a new image or any new package version misses
      # and is fetched and cached again. On a hit the first attempt installs with --no-download,
      # which fails rather than touch the mirror if anything is missing, and the retry then fetches
      # as before. The cache steps cannot fail the job: each continues on error, and a resolve or
      # restore that fails, times out or misses falls back to the two bounded attempts. A resolve
      # that timed out leaves its root apt-get holding the lists lock, so a miss clears it first.
      # Main saves what pull requests and merge groups restore, right after the install so a later
      # test failure or a cancelled main run still keeps it. The Playwright installs in the browser
      # job are not cached: Playwright owns their package list, and their 18.4 MB of archives fits
      # both six-minute attempts down to about 26 kB/s.
      - name: Resolve Isolated Video Decoder Packages
        id: video-decoder-packages
        continue-on-error: true
        timeout-minutes: 2
        run: |
          : "${ImageOS:?}" "${ImageVersion:?}"
          sudo apt-get update -qq
          archives="$(sudo apt-get install -qq --print-uris --no-install-recommends bubblewrap ffmpeg)"
          test -n "$archives"
          printf '%s\n' "$archives" > "$RUNNER_TEMP/video-decoder-packages.txt"
          digest="$(cut -d ' ' -f 2- "$RUNNER_TEMP/video-decoder-packages.txt" | sort | sha256sum | cut -c 1-64)"
          echo "key=video-decoder-$ImageOS-$ImageVersion-$digest" >> "$GITHUB_OUTPUT"
      - name: Restore Isolated Video Decoder Packages
        id: video-decoder-cache
        if: steps.video-decoder-packages.outputs.key != ''
        continue-on-error: true
        timeout-minutes: 2
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/video-decoder-packages
          key: ${{ steps.video-decoder-packages.outputs.key }}
      - name: Install Isolated Video Decoder for Unit Tests
        id: video-decoder
        continue-on-error: true
        timeout-minutes: 7
        env:
          CACHE_HIT: ${{ steps.video-decoder-cache.outputs.cache-hit }}
        run: |
          if [ "$CACHE_HIT" = true ]; then
            sudo cp ~/.cache/video-decoder-packages/*.deb /var/cache/apt/archives/
            sudo apt-get install -y --no-install-recommends --no-download bubblewrap ffmpeg
          else
            sudo pkill -KILL -x apt-get || true
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends bubblewrap ffmpeg
          fi
      - name: Retry Install Isolated Video Decoder for Unit Tests
        if: ${{ !cancelled() && steps.video-decoder.outcome == 'failure' }}
        timeout-minutes: 7
        run: |
          trap 'echo "::error::Install Isolated Video Decoder for Unit Tests failed on both attempts, so the unit tests did not run"' ERR
          sudo pkill -KILL -x 'apt-get|dpkg' || true
          sudo dpkg --configure -a
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends bubblewrap ffmpeg
      - name: Verify Isolated Video Decoder for Unit Tests
        timeout-minutes: 1
        run: |
          bwrap --version
          ffmpeg -hide_banner -version
      # Only the archives the key was computed from, so a hit restores exactly that set.
      - name: Collect Isolated Video Decoder Packages
        id: video-decoder-collect
        if: steps.video-decoder-packages.outputs.key != '' && steps.video-decoder-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        timeout-minutes: 1
        run: |
          rm -rf ~/.cache/video-decoder-packages
          mkdir -p ~/.cache/video-decoder-packages
          while read -r _ archive _; do
            cp "/var/cache/apt/archives/$archive" ~/.cache/video-decoder-packages/
          done < "$RUNNER_TEMP/video-decoder-packages.txt"
      - name: Save Isolated Video Decoder Packages
        if: steps.video-decoder-collect.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 2
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/video-decoder-packages
          key: ${{ steps.video-decoder-packages.outputs.key }}

      - name: Provision Engine Boundary Package Managers
        shell: bash
        run: |
          package_manager="$(node -p 'require("./package.json").packageManager')"
          npm install --prefix "$RUNNER_TEMP/engine-pnpm-10" --ignore-scripts --no-audit --no-fund --package-lock=false pnpm@10.11.0
          npm install --prefix "$RUNNER_TEMP/engine-pnpm-current" --ignore-scripts --no-audit --no-fund --package-lock=false "$package_manager"

      - name: Setup Minimum Node 22
        id: setup_node_22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        continue-on-error: true
        with:
          node-version: 22.13.0
      - name: Retry Setup Minimum Node 22
        if: ${{ !cancelled() && steps.setup_node_22.outcome == 'failure' }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.13.0
      - name: Verify Node 22 Engine Boundary
        run: node scripts/check-node-engines.mjs "$RUNNER_TEMP/engine-pnpm-10/node_modules/pnpm/bin/pnpm.cjs" "$RUNNER_TEMP/engine-pnpm-current/node_modules/pnpm/bin/pnpm.cjs"

      - name: Setup Excluded Node 23
        id: setup_excluded_node_23
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        continue-on-error: true
        with:
          node-version: 23.2.0
      - name: Retry Setup Excluded Node 23
        if: ${{ !cancelled() && steps.setup_excluded_node_23.outcome == 'failure' }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 23.2.0
      - name: Verify Excluded Node Engine Boundary
        run: node scripts/check-node-engines.mjs "$RUNNER_TEMP/engine-pnpm-10/node_modules/pnpm/bin/pnpm.cjs" "$RUNNER_TEMP/engine-pnpm-current/node_modules/pnpm/bin/pnpm.cjs"

      - name: Setup Minimum Node 23
        id: setup_node_23
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        continue-on-error: true
        with:
          node-version: 23.4.0
      - name: Retry Setup Minimum Node 23
        if: ${{ !cancelled() && steps.setup_node_23.outcome == 'failure' }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 23.4.0
      - name: Verify Node 23 Engine Boundary
        run: node scripts/check-node-engines.mjs "$RUNNER_TEMP/engine-pnpm-10/node_modules/pnpm/bin/pnpm.cjs" "$RUNNER_TEMP/engine-pnpm-current/node_modules/pnpm/bin/pnpm.cjs"

      - name: Restore Node 24
        id: restore_node_24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        continue-on-error: true
        with:
          node-version-file: .nvmrc
      - name: Retry Restore Node 24
        if: ${{ !cancelled() && steps.restore_node_24.outcome == 'failure' }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - name: Verify Recommended Node Engine Boundary
        run: node scripts/check-node-engines.mjs "$RUNNER_TEMP/engine-pnpm-10/node_modules/pnpm/bin/pnpm.cjs" "$RUNNER_TEMP/engine-pnpm-current/node_modules/pnpm/bin/pnpm.cjs"

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit Tests
        run: pnpm test

      - name: Validate Web Production Build
        run: pnpm --filter @wollipog/web build

      - name: Validate Runner Bundle
        run: pnpm --filter @wollipog/runner exec node scripts/build-binary.mjs --bundle-only

      # esbuild-only pass (build-sidecar.mjs --bundle-only): proves the control plane and
      # its deps still bundle into one CJS file. Skips the SEA/postject/Tauri steps, so no
      # rustc or target triple is needed here.
      - name: Validate Control-Plane Bundle
        run: pnpm --filter @wollipog/desktop exec node scripts/build-sidecar.mjs --bundle-only

  browser:
    if: github.event_name != 'pull_request' || github.event.action == 'ready_for_review' || github.event.pull_request.draft == false
    name: Browser End-to-End Tests
    runs-on: ubuntu-22.04
    # Measured on 2026-09-30 over 310 passing jobs, four shards took a median 14 minutes and at most
    # 16.6 (995 seconds, setup included): past the fifteen-minute budget, which cancelled shards
    # whose tests had all passed (#2067). Five shards cut the median to 11.4 minutes over three runs;
    # the slowest took 16.3 (975 seconds: a slow dependency install plus shard 1's production pass).
    # Playwright splits by test count, not time, so which shard is slowest moves as files are added.
    # Twenty-five keeps over eight minutes spare for a slow runner, and stays below the old thirty so
    # a doubling of the suite is a loud failure rather than a creep towards the cap (#842).
    timeout-minutes: 25
    strategy:
      # Every shard reports. With fail-fast the first real failure cancels its siblings, and the
      # aggregator below reads a cancelled job as a budget hit — so one broken test would be
      # announced as four timeouts, which is the opposite of a useful signal.
      fail-fast: false
      matrix:
        # The shard COUNT is duplicated in the --shard denominator below because GitHub offers no
        # way to read the matrix length from inside the job. scripts/workflow-pr-event-contract.test.mjs
        # asserts the two agree: a matrix of five against --shard=i/4 overruns, and a matrix of
        # four against --shard=i/5 silently drops a fifth of the suite and still reports green.
        shard: [1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Setup Node 24
        id: setup_node_24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        continue-on-error: true
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Retry Setup Node 24
        if: ${{ !cancelled() && steps.setup_node_24.outcome == 'failure' }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Resolve Playwright Version
        id: playwright-version
        run: |
          playwright_version="$(pnpm exec playwright --version)"
          echo "version=${playwright_version#Version }" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright Browser
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.playwright-version.outputs.version }}

      # Both installs fetch Chromium's system packages through apt, and a stalled mirror once held
      # one silent until the job budget cancelled the shard before any test ran (run 36729343435,
      # #2123). Across 2,516 successful installs from 2026-09-20 to 2026-09-30 the step took a
      # median of 20 seconds and a p99 of 61, but a slow yet moving mirror (73 kB/s) stretched one
      # to 321, so six minutes clears every measured success. A stall then costs six minutes plus a
      # retry rather than the shard's 25. A step timeout signals only the step's shell, so a
      # timed-out attempt's Playwright and root apt processes keep running and holding the apt and
      # dpkg locks; the retry kills them and finishes any interrupted dpkg run before installing
      # again, reusing any packages the first attempt finished downloading.
      - name: Install Playwright Browser
        id: playwright-browser
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        timeout-minutes: 6
        run: pnpm exec playwright install --with-deps chromium
      - name: Retry Install Playwright Browser
        if: ${{ !cancelled() && steps.playwright-browser.outcome == 'failure' }}
        timeout-minutes: 6
        run: |
          pkill -KILL -f 'playwright[^ ]* install' || true
          sudo pkill -KILL -x 'apt-get|dpkg' || true
          sudo dpkg --configure -a
          pnpm exec playwright install --with-deps chromium

      - name: Install Playwright System Dependencies
        id: playwright-system-dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        continue-on-error: true
        timeout-minutes: 6
        run: pnpm exec playwright install-deps chromium
      - name: Retry Install Playwright System Dependencies
        if: ${{ !cancelled() && steps.playwright-system-dependencies.outcome == 'failure' }}
        timeout-minutes: 6
        run: |
          pkill -KILL -f 'playwright[^ ]* install' || true
          sudo pkill -KILL -x 'apt-get|dpkg' || true
          sudo dpkg --configure -a
          pnpm exec playwright install-deps chromium

      - name: Remote-Instance Browser End-to-End Tests
        run: pnpm test:e2e --shard=${{ matrix.shard }}/5

      # The production pass is thirty-three seconds and does not shard: it builds the app once and
      # loads it once. Running it on every shard would be five copies of the same evidence.
      - name: Validate Web Production Build
        if: matrix.shard == 1
        run: pnpm --filter @wollipog/web build

      - name: Rendered Production Browser Smoke
        if: matrix.shard == 1
        run: pnpm test:e2e:production

      # esbuild-only pass (build-binary.mjs --bundle-only): proves the runner and its
      # dependencies still bundle into one CJS file. Skips SEA/postject packaging, so no
      # rustc or target triple is needed here.

  # The win32 settings-rows baselines, which the Ubuntu browser job above cannot see. The called
  # workflow compares on Windows only when the diff touches that spec or its baselines, and reports
  # success otherwise; when it fails, its summary and artifact carry the regenerated images.
  win32:
    if: github.event_name != 'pull_request' || github.event.action == 'ready_for_review' || github.event.pull_request.draft == false
    name: Settings-Rows win32 Baselines
    uses: ./.github/workflows/settings-rows-win32.yml

  check:
    # Report failed, cancelled or skipped dependencies while PR CI is active. !cancelled()
    # lets superseded PR runs cancel this job (#2452), without changing non-PR aggregation.
    # It is a status function, so no implicit success() suppresses failure reporting.
    # Keep the draft/ready-for-review guard; see docs/ci-aggregation.md for the verification limits.
    if: ${{ (github.event_name != 'pull_request' || !cancelled()) && (github.event_name != 'pull_request' || github.event.action == 'ready_for_review' || github.event.pull_request.draft == false) }}
    name: Typecheck, Test & Sidecar Bundle
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    needs: [checks, browser, win32]
    steps:
      - name: Require Every Job to Have Succeeded
        env:
          CHECKS_RESULT: ${{ needs.checks.result }}
          BROWSER_RESULT: ${{ needs.browser.result }}
          WIN32_RESULT: ${{ needs.win32.result }}
        run: |
          status=0
          report() {
            case "$2" in
              success) echo "$1: success" ;;
              cancelled) echo "::error::$1 was cancelled: it exceeded its timeout-minutes budget or the run was cancelled"; status=1 ;;
              *) echo "::error::$1 ended with result '$2'"; status=1 ;;
            esac
          }
          report "Typecheck, Unit Tests & Bundles" "$CHECKS_RESULT"
          report "Browser End-to-End Tests" "$BROWSER_RESULT"
          report "Settings-Rows win32 Baselines" "$WIN32_RESULT"
          exit "$status"
