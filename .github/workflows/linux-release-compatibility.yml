name: Linux Release Compatibility

# Build real unsigned Linux packages on each native architecture without publishing
# a release or accessing signing secrets. This exercises the same pinned userland.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - ".github/workflows/release.yml"
      - ".github/workflows/linux-release-compatibility.yml"
      - "scripts/install-linux-release-deps.sh"
      - "scripts/verify-linux-release-baseline.sh"
      - "apps/desktop/**"
      - "apps/runner/scripts/build-binary.mjs"
      - "pnpm-lock.yaml"
      - ".nvmrc"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ github.event_name == 'pull_request' && github.event.pull_request.draft && github.event.action != 'ready_for_review' && 'draft' || 'active' }}
  cancel-in-progress: true

jobs:
  baseline:
    if: github.event_name != 'pull_request' || github.event.action == 'ready_for_review' || github.event.pull_request.draft == false
    name: Linux Release Baseline (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    container: ubuntu:22.04@sha256:5ec03bb3441e8b0bf3b4f9cd4629a1ae763010dc3035bb8da3ae6cf026486401
    timeout-minutes: 45
    env:
      APPIMAGE_EXTRACT_AND_RUN: "1"
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
    steps:
      - name: Bootstrap Linux Build Container
        shell: bash
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends ca-certificates curl git sudo
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Linux Build Dependencies
        run: bash scripts/install-linux-release-deps.sh
      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - name: Setup Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: ${{ matrix.target }}
      - name: Cache Rust Build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: apps/desktop/src-tauri
          key: ${{ matrix.target }}-ubuntu22.04
      - name: Install Dependencies
        run: pnpm install --frozen-lockfile
      - name: Build Linux Release Packages
        run: pnpm --filter @wollipog/desktop tauri build --target ${{ matrix.target }}
      - name: Verify Linux Release Baseline
        run: bash scripts/verify-linux-release-baseline.sh "${{ matrix.target }}"
