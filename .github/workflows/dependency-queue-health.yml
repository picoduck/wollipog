name: Dependency Queue Health

# Dependabot runs Monday morning in America/Chicago. This check runs the following day so version
# updates have time to become pull requests, then makes a stalled or incomplete queue visible as a
# failed scheduled workflow. A dependency intentionally deferred outside dependabot.yml must have
# an open `dependencies` issue containing a line such as `Dependabot-Deferral: package-name`.

on:
  schedule:
    - cron: "0 14 * * 2"
  workflow_dispatch:

permissions:
  contents: read
  issues: read
  pull-requests: read

concurrency:
  group: dependency-queue-health
  cancel-in-progress: true

jobs:
  check:
    name: Detect Dependabot Queue Stalls
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Setup Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Collect Dependency Queue State
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node scripts/check-dependabot-stall.mjs \
            --collect-outdated "$RUNNER_TEMP/outdated.json"
          gh pr list --state open --author app/dependabot --limit 100 \
            --json number,title,body,url,createdAt,statusCheckRollup > "$RUNNER_TEMP/pulls.json"
          gh issue list --state open --label dependencies --limit 100 \
            --json number,title,body,url > "$RUNNER_TEMP/issues.json"

      - name: Check Dependency Queue Health
        run: |
          node scripts/check-dependabot-stall.mjs \
            --outdated "$RUNNER_TEMP/outdated.json" \
            --pulls "$RUNNER_TEMP/pulls.json" \
            --issues "$RUNNER_TEMP/issues.json" \
            --config .github/dependabot.yml \
            --summary "$GITHUB_STEP_SUMMARY"
