name: Codex Sandbox

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "apps/runner/src/agent-control-sandbox-cli*"
      - "apps/runner/src/fixtures/sandboxed-cli-probe.mjs"
      - ".github/workflows/codex-sandbox.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  codex-sandbox:
    name: Real Codex Sandbox (${{ matrix.codex }})
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        codex: ["0.162.1", "0.163.0"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Real Sandbox Prerequisites
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y bubblewrap
          npm install --prefix "$RUNNER_TEMP/codex" --no-save --package-lock=false "@openai/codex@${{ matrix.codex }}"
      - name: Exercise Every Real Sandbox Case
        env:
          CODEX_BIN: ${{ runner.temp }}/codex/node_modules/.bin/codex
        shell: bash
        run: |
          set -uo pipefail
          "$CODEX_BIN" --version
          node --version
          uname -sm
          probe() {
            local label="$1" parent="$2" configuration="$3"
            local probe_root
            probe_root=$(mktemp -d "$parent/wollipog-write-control-XXXXXX")
            mkdir "$probe_root/workspace" "$probe_root/codex-home"
            local environment=()
            if [ "$configuration" = clean ]; then
              environment=("HOME=$probe_root/codex-home" "CODEX_HOME=$probe_root/codex-home")
            fi
            printf '%s: ' "$label"
            env "${environment[@]}" "$CODEX_BIN" sandbox -P :workspace -C "$probe_root/workspace" -- node -e 'try { require("fs").writeFileSync(process.argv[1], "probe"); console.log("written"); } catch (error) { console.log(error.code); }' "$probe_root/outside-workspace"
          }
          probe temp-default /tmp inherited
          probe temp-clean /tmp clean
          probe outside-temp-clean "$RUNNER_TEMP" clean
          rc=0
          node --import tsx --test --test-reporter=tap --test-timeout=180000 apps/runner/src/agent-control-sandbox-cli.integration.test.ts > "$RUNNER_TEMP/codex-sandbox.tap" 2>&1 || rc=$?
          cat "$RUNNER_TEMP/codex-sandbox.tap"
          if [ "$rc" -ne 0 ]; then exit "$rc"; fi
          grep -qx '# pass 6' "$RUNNER_TEMP/codex-sandbox.tap"
          grep -qx '# skipped 0' "$RUNNER_TEMP/codex-sandbox.tap"
