name: Release Stapling Diagnostic
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-stapling-transport:
    name: Verify Intel Stapling Transport
    runs-on: macos-15-intel
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Verify Publisher Bytes and Test Stapling Transport
        shell: bash
        run: |
          set -euo pipefail
          gh api 'repos/picoduck/wollipog/releases/415545650/assets?per_page=100' > metadata.json
          jq -e '[.[] | select(.name == "Wollipog_x64.app.tar.gz")] | length == 1' metadata.json
          asset_id=$(jq -er '.[] | select(.name == "Wollipog_x64.app.tar.gz") | .id' metadata.json)
          digest=$(jq -er '.[] | select(.name == "Wollipog_x64.app.tar.gz") | .digest' metadata.json)
          [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]
          gh api "repos/picoduck/wollipog/releases/assets/$asset_id" -H 'Accept: application/octet-stream' > app.tar.gz
          printf '%s  app.tar.gz\n' "${digest#sha256:}" | shasum -a 256 -c -
          mkdir before after
          tar -xzf app.tar.gz -C before
          tar -xzf app.tar.gz -C after
          codesign --verify --deep --strict --verbose=2 before/Wollipog.app
          if xcrun stapler validate before/Wollipog.app; then
            echo '::error::Expected the exact failed archive to lack its stapled ticket'
            exit 1
          fi
          echo 'Testing default transport on the failed release archive'
          set +e
          xcrun stapler staple -v before/Wollipog.app
          default_rc=$?
          set -e
          echo "Default stapler exit code: $default_rc"
          echo 'Testing the runner-team workaround on a fresh copy of the same archive'
          echo 'block return out quick proto udp from any to any port 443' | sudo pfctl -f -
          sudo pfctl -E
          xcrun stapler staple -v after/Wollipog.app
          xcrun stapler validate after/Wollipog.app
          codesign --verify --deep --strict --verbose=2 after/Wollipog.app
          spctl --assess --type execute --verbose=2 after/Wollipog.app
          echo 'Verified: original missing-ticket failure reproduced; TCP fallback staples and verifies the same signed app'
