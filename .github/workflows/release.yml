name: Release

# Builds the per-platform control-plane SEA sidecar + Tauri desktop bundles on native
# runners (the sidecar embeds the host Node runtime, so it CANNOT be cross-compiled —
# every arch is built on a matching native runner) and uploads them to a draft GitHub
# release. See apps/desktop/scripts/build-sidecar.mjs and apps/desktop/src-tauri/tauri.conf.json.

on:
  push:
    tags:
      - "v*"
  # Manual runs are throwaway test builds: pick the branch/tag to build from the "Run
  # workflow" ref dropdown. A branch run is labeled with a unique v0.0.0-test.<run> tag
  # (see the preflight job); a tag run is treated like a real release of that tag.
  workflow_dispatch:
    inputs:
      windows_signing:
        # A tag run always signs. A branch test run signs only when asked, and only once that
        # branch is temporarily allowed by the `release` environment's deployment policy.
        description: Sign the Windows test build through Azure Artifact Signing
        type: boolean
        default: false

permissions:
  contents: write # tauri-action creates the GitHub release + uploads assets

# A re-pushed tag (or re-dispatch from the same ref) supersedes an in-flight run.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Resolve the release tag once, and for real (tag-triggered) releases fail fast unless
  # the tag matches the packaged version everywhere. This keeps mislabeled installers and
  # colliding throwaway "test" releases from ever reaching the (expensive) matrix build.
  preflight:
    name: Resolve tag & check version
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    outputs:
      release_tag: ${{ steps.resolve.outputs.release_tag }}
      prerelease: ${{ steps.resolve.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolve release tag
        id: resolve
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          if [ "$REF_TYPE" = tag ]; then
            tag="$REF_NAME"                 # real release: build & label the pushed tag
          else
            tag="v0.0.0-test.$RUN_NUMBER"   # branch dispatch: unique throwaway draft
          fi
          echo "release_tag=$tag" >>"$GITHUB_OUTPUT"
          # Pre-release when the tag carries a suffix (covers -rc.N and -test.N throwaways).
          case "$tag" in *-*) echo "prerelease=true" ;; *) echo "prerelease=false" ;; esac >>"$GITHUB_OUTPUT"
          echo "Release tag: $tag"

      # All packaged-app and runner version fields must agree with the release tag. The control
      # plane uses this identity to select the matching remote-runner artifact at runtime.
      - name: Verify tag matches the packaged version
        if: github.ref_type == 'tag'
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          ver="${REF_NAME#v}"
          tauri=$(jq -r .version apps/desktop/src-tauri/tauri.conf.json)
          deskpkg=$(jq -r .version apps/desktop/package.json)
          rootpkg=$(jq -r .version package.json)
          cargo=$(sed -nE 's/^version = "(.*)"/\1/p' apps/desktop/src-tauri/Cargo.toml | head -1 | tr -d '\r')
          controlplane=$(sed -nE 's/^export const APP_RELEASE_VERSION = "(.*)";/\1/p' apps/control-plane/src/release-version.ts | tr -d '\r')
          runner=$(sed -nE 's/^export const VERSION = "(.*)";/\1/p' apps/runner/src/version.ts | tr -d '\r')
          fail=0
          for pair in "tauri.conf.json=$tauri" "apps/desktop/package.json=$deskpkg" "package.json=$rootpkg" "Cargo.toml=$cargo" "control-plane release=$controlplane" "runner VERSION=$runner"; do
            name="${pair%%=*}"; val="${pair#*=}"
            if [ "$val" != "$ver" ]; then
              echo "::error::$name is '$val' but tag $REF_NAME expects '$ver'"; fail=1
            fi
          done
          if [ "$fail" != 0 ]; then
            echo "Bump all release version fields to $ver before tagging — see docs/RELEASING.md"
            exit 1
          fi
          echo "All release version fields match $ver"

  build:
    name: ${{ matrix.label }}
    needs: preflight
    runs-on: ${{ matrix.os }}
    # macOS legs wait on the notary service (tauri passes --wait with no cap of its own). A
    # first submission from a newly enrolled team has sat in Apple's queue for over 40 minutes;
    # later ones normally clear in minutes. Keep the other platforms on the tighter budget.
    timeout-minutes: ${{ startsWith(matrix.os, 'macos') && 120 || 45 }}
    # Windows legs that sign run in the `release` environment. It holds the Azure identity
    # variables and admits only `v*` tags, and Azure trusts a token only from this repository in
    # this environment. Every other leg, and an unsigned branch test run, uses no environment.
    environment: ${{ startsWith(matrix.os, 'windows') && (github.ref_type == 'tag' || inputs.windows_signing) && 'release' || '' }}
    permissions:
      contents: write # tauri-action creates the GitHub release + uploads assets
      id-token: write # Windows legs exchange a GitHub OIDC token for Azure Artifact Signing access
    strategy:
      fail-fast: false # one platform failing must not cancel the others
      matrix:
        include:
          - label: macOS (Apple Silicon)
            os: macos-14
            target: aarch64-apple-darwin
          - label: macOS (Intel)
            os: macos-15-intel
            target: x86_64-apple-darwin
          - label: Windows x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
          - label: Windows ARM64
            os: windows-11-arm
            target: aarch64-pc-windows-msvc
          - label: Linux x64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - label: Linux ARM64
            os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Tauri v2 Linux build/runtime deps (webkit2gtk 4.1, tray, AppImage tooling).
      - name: Install Linux build deps
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            build-essential \
            libssl-dev \
            file

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      # Node 24 is mandatory: the SEA targets node24 and the control plane uses node:sqlite.
      # On windows-11-arm this provides the native win-arm64 Node the SEA must embed.
      - name: Setup Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: apps/desktop/src-tauri
          key: ${{ matrix.target }}

      # Must precede the Tauri build: tauri.conf.json beforeBuildCommand runs
      # sidecar:build + web build, which need node_modules. allowBuilds:esbuild in
      # pnpm-workspace.yaml lets esbuild's postinstall run under pnpm's build-script gate.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # macOS Developer ID signing + notarization. The APPLE_* secrets are exported to the build
      # step only here, only on macOS, and only when the certificate secret is non-empty.
      # A branch (test) dispatch without the certificate builds an unsigned throwaway bundle
      # instead of failing on an empty certificate; a real tag run without it fails, so a
      # missing or deleted secret can never publish an unsigned release whose body claims
      # signing. A present-but-broken secret fails the leg (the bundler aborts on a signing or
      # notarization error, and the verification step below re-checks the result).
      #
      # Notarization authenticates with an App Store Connect API key when the three
      # APPLE_API_* secrets are present, and otherwise with the Apple ID trio. The bundler
      # prefers the Apple ID trio whenever all three of its variables are set, so exactly one
      # method is exported. The key is preferred: the notary service has returned HTTP 500 to
      # app-specific-password submissions from accounts that work with a key, and Apple's own
      # guidance for that failure is to switch to key-based authentication.
      # Windows Authenticode is configured by the next three steps.
      - name: Export macOS signing credentials
        if: startsWith(matrix.os, 'macos')
        shell: bash
        env:
          REF_TYPE: ${{ github.ref_type }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -z "$APPLE_CERTIFICATE" ]; then
            if [ "$REF_TYPE" = "tag" ]; then
              echo "::error::APPLE_CERTIFICATE is not available on a tag run; refusing to publish an unsigned macOS release"
              exit 1
            fi
            echo "::warning::APPLE_CERTIFICATE is not available; building an unsigned macOS bundle for this test dispatch"
            echo "MACOS_SIGNING=0" >> "$GITHUB_ENV"
            exit 0
          fi
          for name in APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY; do
            if [ -z "${!name}" ]; then
              echo "::error::APPLE_CERTIFICATE is set but $name is empty; refusing a partially configured signing setup"
              exit 1
            fi
          done
          {
            echo "MACOS_SIGNING=1"
            echo "APPLE_CERTIFICATE=$APPLE_CERTIFICATE"
            echo "APPLE_CERTIFICATE_PASSWORD=$APPLE_CERTIFICATE_PASSWORD"
            echo "APPLE_SIGNING_IDENTITY=$APPLE_SIGNING_IDENTITY"
          } >> "$GITHUB_ENV"
          if [ -n "$APPLE_API_KEY_ID" ] || [ -n "$APPLE_API_ISSUER_ID" ] || [ -n "$APPLE_API_KEY_P8" ]; then
            for name in APPLE_API_KEY_ID APPLE_API_ISSUER_ID APPLE_API_KEY_P8; do
              if [ -z "${!name}" ]; then
                echo "::error::App Store Connect API key notarization is partially configured: $name is empty"
                exit 1
              fi
            done
            key_dir=$(mktemp -d)
            key_path="$key_dir/AuthKey_${APPLE_API_KEY_ID}.p8"
            umask 077
            printf '%s' "$APPLE_API_KEY_P8" | base64 --decode > "$key_path"
            grep -q "BEGIN PRIVATE KEY" "$key_path" || { echo "::error::APPLE_API_KEY_P8 did not decode to a PEM private key"; exit 1; }
            {
              echo "APPLE_API_KEY=$APPLE_API_KEY_ID"
              echo "APPLE_API_ISSUER=$APPLE_API_ISSUER_ID"
              echo "APPLE_API_KEY_PATH=$key_path"
            } >> "$GITHUB_ENV"
            echo "macOS signing enabled for identity: $APPLE_SIGNING_IDENTITY; notarizing with App Store Connect API key $APPLE_API_KEY_ID"
            exit 0
          fi
          for name in APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            if [ -z "${!name}" ]; then
              echo "::error::No App Store Connect API key is configured and Apple ID notarization is missing $name"
              exit 1
            fi
          done
          {
            echo "APPLE_ID=$APPLE_ID"
            echo "APPLE_PASSWORD=$APPLE_PASSWORD"
            echo "APPLE_TEAM_ID=$APPLE_TEAM_ID"
          } >> "$GITHUB_ENV"
          echo "macOS signing enabled for identity: $APPLE_SIGNING_IDENTITY; notarizing with Apple ID"

      # Windows Authenticode signing through Azure Artifact Signing. The Azure identity lives in
      # the `release` environment's variables, so a leg outside that environment sees none of them.
      # A run that requires signing (a tag, or a dispatch with windows_signing selected) then fails;
      # only an unrequested branch test dispatch builds an unsigned throwaway bundle. A partial
      # configuration fails either way. The signing client is pinned by version and SHA-256. It
      # ships only x64 and x86 builds, so the x64 signtool loads it on both Windows legs, and the
      # ARM64 leg adds an x64 .NET 8 runtime pinned by version and SHA-512 for emulation.
      - name: Configure Windows Authenticode signing
        if: startsWith(matrix.os, 'windows')
        shell: pwsh
        env:
          # The same condition that places this leg in the `release` environment.
          SIGNING_REQUIRED: ${{ github.ref_type == 'tag' || inputs.windows_signing }}
          AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          ARTIFACT_SIGNING_ENDPOINT: ${{ vars.ARTIFACT_SIGNING_ENDPOINT }}
          ARTIFACT_SIGNING_ACCOUNT: ${{ vars.ARTIFACT_SIGNING_ACCOUNT }}
          ARTIFACT_SIGNING_PROFILE: ${{ vars.ARTIFACT_SIGNING_PROFILE }}
          ARTIFACT_SIGNING_CLIENT_VERSION: 1.0.128
          ARTIFACT_SIGNING_CLIENT_SHA256: 74bd7d27e6ce1051409c38d9b46bc8df0400ecd643d51ffbf2ac00869061e40b
          DOTNET_RUNTIME_X64_VERSION: 8.0.31
          DOTNET_RUNTIME_X64_SHA512: 9c55c58694676ee64b0eed2cd6d8cbf58b9aa8288420acc66841e15ca0099c75d4af0182d23a641c2342e5a151a325df4a12fa0bde2e47c0fb7e9a33e7b09896
        run: |
          $ErrorActionPreference = 'Stop'
          $names = 'AZURE_CLIENT_ID', 'AZURE_TENANT_ID', 'AZURE_SUBSCRIPTION_ID',
            'ARTIFACT_SIGNING_ENDPOINT', 'ARTIFACT_SIGNING_ACCOUNT', 'ARTIFACT_SIGNING_PROFILE'
          $missing = @($names | Where-Object { -not [Environment]::GetEnvironmentVariable($_) })
          if ($missing.Count -eq $names.Count) {
            if ($env:SIGNING_REQUIRED -eq 'true') {
              Write-Output "::error::Windows signing is required for this run but its variables are not available; refusing to build unsigned Windows bundles"
              exit 1
            }
            Write-Output "::warning::Windows signing is not configured for this run; building unsigned Windows bundles for this test dispatch"
            'WINDOWS_SIGNING=0' | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
            exit 0
          }
          if ($missing.Count -gt 0) {
            Write-Output "::error::Windows signing is partially configured; missing: $($missing -join ', ')"
            exit 1
          }

          $root = Join-Path $env:RUNNER_TEMP 'artifact-signing'
          New-Item -ItemType Directory -Force -Path $root | Out-Null
          $version = $env:ARTIFACT_SIGNING_CLIENT_VERSION
          $package = Join-Path $root 'client.zip'
          Invoke-WebRequest -OutFile $package -Uri "https://api.nuget.org/v3-flatcontainer/microsoft.artifactsigning.client/$version/microsoft.artifactsigning.client.$version.nupkg"
          $digest = (Get-FileHash -Algorithm SHA256 -Path $package).Hash.ToLowerInvariant()
          if ($digest -ne $env:ARTIFACT_SIGNING_CLIENT_SHA256) {
            Write-Output "::error::Artifact Signing client $version has SHA-256 $digest, expected $env:ARTIFACT_SIGNING_CLIENT_SHA256"
            exit 1
          }
          Expand-Archive -Path $package -DestinationPath (Join-Path $root 'client') -Force
          $dlib = Join-Path $root 'client\bin\x64\Azure.CodeSigning.Dlib.dll'
          if (-not (Test-Path $dlib)) { Write-Output "::error::the Artifact Signing client has no x64 dlib"; exit 1 }

          $kits = Join-Path ${env:ProgramFiles(x86)} 'Windows Kits\10\bin'
          $signtool = Get-ChildItem -Path $kits -Filter signtool.exe -Recurse |
            Where-Object { $_.Directory.Name -eq 'x64' -and $_.Directory.Parent.Name -match '^10\.\d+\.\d+\.\d+$' } |
            Sort-Object { [version]$_.Directory.Parent.Name } -Descending |
            Select-Object -First 1
          if (-not $signtool) { Write-Output "::error::no x64 signtool.exe found under $kits"; exit 1 }

          if ($env:RUNNER_ARCH -eq 'ARM64') {
            $dotnet = Join-Path $root 'dotnet-x64'
            $runtimeVersion = $env:DOTNET_RUNTIME_X64_VERSION
            $runtimeArchive = Join-Path $root 'dotnet-runtime-x64.zip'
            Invoke-WebRequest -OutFile $runtimeArchive -Uri "https://builds.dotnet.microsoft.com/dotnet/Runtime/$runtimeVersion/dotnet-runtime-$runtimeVersion-win-x64.zip"
            $runtimeDigest = (Get-FileHash -Algorithm SHA512 -Path $runtimeArchive).Hash.ToLowerInvariant()
            if ($runtimeDigest -ne $env:DOTNET_RUNTIME_X64_SHA512) {
              Write-Output "::error::.NET runtime $runtimeVersion has SHA-512 $runtimeDigest, expected $env:DOTNET_RUNTIME_X64_SHA512"
              exit 1
            }
            Expand-Archive -Path $runtimeArchive -DestinationPath $dotnet -Force
            "DOTNET_ROOT_X64=$dotnet" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          }

          # Only the Azure CLI credential applies here, and the managed-identity probe stalls on
          # hosted runners, so every other credential is excluded.
          $metadata = Join-Path $root 'metadata.json'
          [ordered]@{
            Endpoint = $env:ARTIFACT_SIGNING_ENDPOINT
            CodeSigningAccountName = $env:ARTIFACT_SIGNING_ACCOUNT
            CertificateProfileName = $env:ARTIFACT_SIGNING_PROFILE
            ExcludeCredentials = @(
              'ManagedIdentityCredential', 'EnvironmentCredential', 'WorkloadIdentityCredential',
              'SharedTokenCacheCredential', 'VisualStudioCredential', 'VisualStudioCodeCredential',
              'AzurePowerShellCredential', 'AzureDeveloperCliCredential', 'InteractiveBrowserCredential'
            )
          } | ConvertTo-Json | Set-Content -Encoding utf8 -Path $metadata

          # A build-time Tauri config overlay, so local builds never see a sign command.
          $signer = (Join-Path $env:GITHUB_WORKSPACE 'apps\runner\scripts\windows-authenticode.mjs').Replace('\', '/')
          $overlay = (Join-Path $root 'tauri-windows-signing.json').Replace('\', '/')
          @{ bundle = @{ windows = @{ signCommand = @{ cmd = 'node'; args = @($signer, '%1') } } } } |
            ConvertTo-Json -Depth 5 | Set-Content -Encoding utf8 -Path $overlay

          @(
            'WINDOWS_SIGNING=1'
            'WOLLIPOG_WINDOWS_SIGNING=1'
            "WOLLIPOG_SIGNTOOL=$($signtool.FullName)"
            "WOLLIPOG_ARTIFACT_SIGNING_DLIB=$dlib"
            "WOLLIPOG_ARTIFACT_SIGNING_METADATA=$metadata"
            "TAURI_WINDOWS_SIGNING_CONFIG=$overlay"
          ) | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          Write-Output "Windows signing enabled: account $env:ARTIFACT_SIGNING_ACCOUNT, profile $env:ARTIFACT_SIGNING_PROFILE, signtool $($signtool.FullName)"

      - name: Sign in to Azure for Windows signing
        if: startsWith(matrix.os, 'windows') && env.WINDOWS_SIGNING == '1'
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      # The GitHub OIDC assertion behind the login is short-lived, and the Azure CLI cannot renew
      # it later in the build. Mint the signing token now; the CLI serves it from its cache to every
      # later signtool call, including the installers signed at the end of the Tauri build.
      - name: Acquire the Artifact Signing access token
        if: startsWith(matrix.os, 'windows') && env.WINDOWS_SIGNING == '1'
        shell: pwsh
        run: |
          $expires = az account get-access-token --scope https://codesigning.azure.net/.default --query expiresOn --output tsv
          if ($LASTEXITCODE -ne 0 -or -not $expires) { Write-Output "::error::could not obtain an Artifact Signing access token"; exit 1 }
          Write-Output "Artifact Signing access token valid until $expires"

      - name: Build & publish desktop bundles
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WOLLIPOG_RUNNER_RELEASE_TAG: ${{ needs.preflight.outputs.release_tag }}
        with:
          projectPath: apps/desktop
          tauriScript: pnpm tauri # use the repo's pinned @tauri-apps/cli, not a global install
          # Passing --target sets TAURI_ENV_TARGET_TRIPLE, which build-sidecar.mjs reads to
          # name the sidecar AND to pass its same-arch guard (arch == host on a native runner).
          # A signing Windows leg adds the overlay that points bundle.windows.signCommand at the
          # shared signer, so Tauri signs the app executable, both installers, and the uninstaller.
          args: --target ${{ matrix.target }}${{ env.WINDOWS_SIGNING == '1' && format(' --config {0}', env.TAURI_WINDOWS_SIGNING_CONFIG) || '' }}
          # Tag/label resolved by preflight: the pushed tag for a real release, or a unique
          # v0.0.0-test.<run> for a branch dispatch. All matrix jobs share one draft release.
          tagName: ${{ needs.preflight.outputs.release_tag }}
          releaseName: Wollipog ${{ needs.preflight.outputs.release_tag }}
          releaseBody: |
            Desktop bundles for Wollipog. Each installer embeds a per-platform
            control-plane sidecar, so the app is self-contained (no separate `pnpm dev`).

            > macOS bundles are Developer ID signed and notarized, and Windows installers and
            > executables are Authenticode signed through Azure Artifact Signing (a branch test
            > dispatch without signing configured is unsigned). SmartScreen may still warn on
            > the first Windows releases until the certificate builds reputation.
          releaseDraft: true
          prerelease: ${{ needs.preflight.outputs.prerelease }}

      # Prove the signed bundle rather than trusting the bundler's exit code: a Developer ID
      # signature on the app and both sidecars, hardened runtime, Gatekeeper acceptance, and a
      # stapled notarization ticket. Runs only when signing was enabled above.
      - name: Verify macOS signature and notarization
        if: startsWith(matrix.os, 'macos') && env.MACOS_SIGNING == '1'
        shell: bash
        run: |
          set -euo pipefail
          app=$(find apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/macos -maxdepth 1 -name '*.app' | head -1)
          [ -n "$app" ] || { echo "::error::no .app bundle found to verify"; exit 1; }
          echo "Verifying $app"
          codesign --verify --deep --strict --verbose=2 "$app"
          for bin in "$app"/Contents/MacOS/*; do
            echo "--- $bin"
            info=$(codesign --display --verbose=2 "$bin" 2>&1)
            printf '%s\n' "$info" | grep -E '^(Identifier|CodeDirectory|Authority=Developer ID Application)' || true
            printf '%s\n' "$info" | grep -q '^Authority=Developer ID Application' \
              || { echo "::error::$bin is not signed with a Developer ID Application certificate"; exit 1; }
            printf '%s\n' "$info" | grep -Eq '^CodeDirectory .*flags=0x[0-9a-f]+\(.*runtime' \
              || { echo "::error::$bin does not carry the hardened runtime flag"; exit 1; }
          done
          spctl --assess --type execute --verbose=2 "$app"
          xcrun stapler validate "$app"
          dmg=$(find apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/dmg -maxdepth 1 -name '*.dmg' | head -1)
          [ -n "$dmg" ] || { echo "::error::no .dmg found to verify"; exit 1; }
          # The bundler signs the dmg but notarizes and staples only the .app inside it.
          codesign --verify --strict --verbose=2 "$dmg"
          echo "Signature, Gatekeeper assessment, and stapled ticket verified"

      # Prove the Windows signatures rather than trusting the signer's exit code. The MSI is
      # unpacked with an administrative install so every executable it ships is checked, not
      # just the files left in the build directory. The standalone runner and control-plane
      # assets are checked too, and every file must carry a timestamped signature from one signer.
      - name: Verify Windows Authenticode signatures
        if: startsWith(matrix.os, 'windows') && env.WINDOWS_SIGNING == '1'
        shell: pwsh
        env:
          TARGET_TRIPLE: ${{ matrix.target }}
        run: |
          $ErrorActionPreference = 'Stop'
          $bundle = "apps/desktop/src-tauri/target/$env:TARGET_TRIPLE/release/bundle"
          $msi = @(Get-ChildItem -Path "$bundle/msi" -Filter *.msi)
          $nsis = @(Get-ChildItem -Path "$bundle/nsis" -Filter *.exe)
          if ($msi.Count -ne 1 -or $nsis.Count -ne 1) {
            Write-Output "::error::expected one MSI and one NSIS installer, found $($msi.Count) and $($nsis.Count)"
            exit 1
          }
          $unpacked = Join-Path $env:RUNNER_TEMP 'msi-contents'
          $install = Start-Process msiexec.exe -Wait -PassThru -ArgumentList @('/a', "`"$($msi[0].FullName)`"", '/qn', "TARGETDIR=`"$unpacked`"")
          if ($install.ExitCode -ne 0) { Write-Output "::error::administrative MSI extraction failed with $($install.ExitCode)"; exit 1 }
          $shipped = @(Get-ChildItem -Path $unpacked -Recurse -Filter *.exe)
          if ($shipped.Count -lt 3) {
            Write-Output "::error::expected the app and both sidecars inside the MSI, found $($shipped.Count) executables"
            exit 1
          }
          $files = @($msi[0], $nsis[0]) + $shipped + @(
            Get-Item "apps/runner/dist-bin/wollipog-runner-$env:TARGET_TRIPLE.exe"
            Get-Item "apps/runner/dist-bin/agent-manager-runner-$env:TARGET_TRIPLE.exe"
            Get-Item "apps/control-plane/dist-bin/wollipog-control-plane-$env:TARGET_TRIPLE.exe"
          )
          $subjects = @{}
          foreach ($file in $files) {
            & $env:WOLLIPOG_SIGNTOOL verify /pa /q $file.FullName
            if ($LASTEXITCODE -ne 0) { Write-Output "::error::$($file.Name) does not verify under the Windows trust policy"; exit 1 }
            $signature = Get-AuthenticodeSignature -FilePath $file.FullName
            if ($signature.Status -ne 'Valid') { Write-Output "::error::$($file.Name) signature status is $($signature.Status)"; exit 1 }
            if (-not $signature.TimeStamperCertificate) { Write-Output "::error::$($file.Name) signature has no timestamp"; exit 1 }
            $subjects[$signature.SignerCertificate.Subject] = $true
            Write-Output "Verified $($file.Name): $($signature.SignerCertificate.Subject)"
          }
          if ($subjects.Count -ne 1) { Write-Output "::error::files are signed by more than one certificate subject: $($subjects.Keys -join '; ')"; exit 1 }
          Write-Output "All $($files.Count) Windows files carry valid, timestamped Authenticode signatures"

      # Tauri's beforeBuildCommand already built one canonical runner SEA and its byte-identical
      # legacy alias through build-sidecar.mjs. Verify and upload those exact artifacts instead of
      # rebuilding, so the desktop-bundled and standalone runner originate from the same build.
      - name: Verify & upload runner binaries
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_TRIPLE: ${{ matrix.target }}
          RELEASE_TAG: ${{ needs.preflight.outputs.release_tag }}
        run: |
          case "$TARGET_TRIPLE" in
            *-pc-windows-msvc) executable=.exe ;;
            *) executable= ;;
          esac
          canonical="apps/runner/dist-bin/wollipog-runner-${TARGET_TRIPLE}${executable}"
          legacy="apps/runner/dist-bin/agent-manager-runner-${TARGET_TRIPLE}${executable}"
          sh scripts/verify-runner-release-version.sh \
            apps/runner/src/version.ts \
            "$canonical" \
            "$legacy"
          cmp -s "$canonical" "$legacy"
          echo "uploading $canonical and $legacy -> $RELEASE_TAG"
          gh release upload "$RELEASE_TAG" "$canonical" "$legacy" --repo "$GITHUB_REPOSITORY" --clobber
          for bin in "$canonical" "$legacy"; do
            asset_name=$(basename "$bin")
            local_sha=$(node -e 'const {createHash}=require("node:crypto");const {readFileSync}=require("node:fs");console.log(createHash("sha256").update(readFileSync(process.argv[1])).digest("hex"))' "$bin")
            remote_digest=$(sh scripts/resolve-draft-release-asset-digest.sh "$GITHUB_REPOSITORY" "$RELEASE_TAG" "$asset_name")
            if ! printf '%s' "$remote_digest" | grep -Eq '^sha256:[0-9a-f]{64}$'; then
              echo "::error::$asset_name has no valid GitHub publisher digest"
              exit 1
            fi
            if [ "${remote_digest#sha256:}" != "$local_sha" ]; then
              echo "::error::$asset_name publisher digest does not match uploaded bytes"
              exit 1
            fi
            echo "Verified publisher digest for $asset_name"
          done

      # build-sidecar.mjs also published the injected, signed control-plane sidecar bytes as the
      # standalone headless asset. Verify its version natively and upload the exact same bytes.
      - name: Verify & upload control-plane binary
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_TRIPLE: ${{ matrix.target }}
          RELEASE_TAG: ${{ needs.preflight.outputs.release_tag }}
        run: |
          case "$TARGET_TRIPLE" in
            *-pc-windows-msvc) executable=.exe ;;
            *) executable= ;;
          esac
          control_plane="apps/control-plane/dist-bin/wollipog-control-plane-${TARGET_TRIPLE}${executable}"
          sh scripts/verify-control-plane-release-version.sh \
            apps/control-plane/src/release-version.ts \
            "$control_plane"
          cmp -s "$control_plane" "apps/desktop/src-tauri/binaries/control-plane-${TARGET_TRIPLE}${executable}"
          echo "uploading $control_plane -> $RELEASE_TAG"
          gh release upload "$RELEASE_TAG" "$control_plane" --repo "$GITHUB_REPOSITORY" --clobber
          asset_name=$(basename "$control_plane")
          local_sha=$(node -e 'const {createHash}=require("node:crypto");const {readFileSync}=require("node:fs");console.log(createHash("sha256").update(readFileSync(process.argv[1])).digest("hex"))' "$control_plane")
          remote_digest=$(sh scripts/resolve-draft-release-asset-digest.sh "$GITHUB_REPOSITORY" "$RELEASE_TAG" "$asset_name")
          if ! printf '%s' "$remote_digest" | grep -Eq '^sha256:[0-9a-f]{64}$'; then
            echo "::error::$asset_name has no valid GitHub publisher digest"
            exit 1
          fi
          if [ "${remote_digest#sha256:}" != "$local_sha" ]; then
            echo "::error::$asset_name publisher digest does not match uploaded bytes"
            exit 1
          fi
          echo "Verified publisher digest for $asset_name"

  # The six native jobs must finish before checksums are generated. Downloading the published
  # bytes also detects upload corruption or a stale asset that a local-only digest would miss.
  # This job also builds and publishes the platform-neutral web bundle for headless deployments.
  verify-runner-release:
    name: Verify runner release assets
    needs: [preflight, build]
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The headless web bundle is the browser build (PWA assets included), not the desktop-trimmed
      # variant the matrix jobs produce, packaged as a `web/` directory the control plane serves
      # from beside its executable or via WOLLIPOG_WEB_DIST.
      - name: Build & publish the web bundle
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.preflight.outputs.release_tag }}
        run: |
          pnpm --filter @wollipog/web build
          rm -rf web-bundle && mkdir web-bundle
          cp -R apps/web/dist web-bundle/web
          test -f web-bundle/web/index.html
          tar -C web-bundle -czf wollipog-web.tar.gz web
          gh release upload "$RELEASE_TAG" wollipog-web.tar.gz --repo "$GITHUB_REPOSITORY" --clobber

      - name: Verify release assets & publish checksums
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.preflight.outputs.release_tag }}
        run: |
          mkdir runner-assets
          gh release download "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern 'wollipog-runner-*' \
            --pattern 'agent-manager-runner-*' \
            --pattern 'wollipog-control-plane-*' \
            --pattern 'wollipog-web.tar.gz' \
            --dir runner-assets
          cmp -s wollipog-web.tar.gz runner-assets/wollipog-web.tar.gz
          node scripts/verify-runner-release-assets.mjs local \
            --assets-dir runner-assets \
            --manifest SHA256SUMS
          gh release upload "$RELEASE_TAG" SHA256SUMS --repo "$GITHUB_REPOSITORY" --clobber

      - name: Gate exact hosted release inventory & digests
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.preflight.outputs.release_tag }}
        run: |
          bash scripts/verify-draft-runner-release.sh \
            "$GITHUB_REPOSITORY" \
            "$RELEASE_TAG" \
            SHA256SUMS
