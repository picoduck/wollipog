name: Stop Obsolete Merge-Group CI

# One monitor watches every active merge-group CI run (#2674). A per-run monitor held a hosted
# runner for each integration the queue built, and those runners are the scarce resource that
# merge-group CI waits for. A completion also wakes the monitor, because a failing group is what
# makes the integrations behind it obsolete.
on:
  workflow_run:
    workflows: [CI]
    types: [in_progress, completed]

# The workflow_run event executes trusted default-branch code. Never check out
# the triggering integration or load its artifacts with this write-capable token.
permissions:
  contents: read
  pull-requests: read
  actions: write

jobs:
  monitor:
    if: github.event.workflow_run.event == 'merge_group' && github.event.workflow_run.repository.full_name == github.repository
    # One monitor at a time, and at most one waiting. This is on the job, not the workflow: every
    # CI event starts the workflow, and a skipped pull-request invocation must never replace a
    # waiting monitor. A waiting monitor replaced by a newer one loses nothing, because each scans
    # every active merge-group run itself.
    concurrency:
      group: merge-group-cleanup
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Watch Merge-Group CI Until It Finishes or Becomes Obsolete
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/merge-group-cleanup.mjs
