name: Main CI Health

on:
  workflow_run:
    workflows: [CI, Main Rolling Validation]
    types: [completed]
  schedule:
    - cron: '3,23,43 * * * *'
  workflow_dispatch:
    inputs:
      worker_run_id:
        description: Exact rolling worker run to await before observation (optional)
        type: string
        default: ''
      worker_attempt:
        description: Exact rolling worker attempt to await (required with run ID)
        type: string
        default: ''

# The workflow_run event executes trusted default-branch code. Never check out
# the triggering commit or load its artifacts with this issue-writing token.
permissions:
  contents: read

jobs:
  reconcile:
    if: github.ref == 'refs/heads/main' && (github.event_name != 'workflow_run' || (github.event.action == 'completed' && ((github.event.workflow_run.event == 'push' && github.event.workflow_run.path == '.github/workflows/ci.yml') || (github.event.workflow_run.event == 'workflow_dispatch' && github.event.workflow_run.path == '.github/workflows/main-rolling-validation.yml')) && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.repository.full_name == github.repository))
    permissions:
      contents: write
      actions: read
      issues: write
    # One reconciliation at a time, so two completions cannot both open an alert. This is on the
    # job, not the workflow: every CI completion starts the workflow, and a skipped pull-request
    # invocation must never replace a pending main reconciliation. A pending main reconciliation
    # replaced by a newer one loses nothing, because each reads the latest main run itself.
    concurrency:
      group: main-ci-health
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    # Three-minute terminal wait plus the existing five-minute observation envelope.
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - name: Reconcile Exact Main Regression Health
        env:
          GITHUB_TOKEN: ${{ github.token }}
          MAIN_CI_HEALTH_OUTPUT: ${{ runner.temp }}/main-ci-health.json
          MAIN_CI_HEALTH_WORKER_RUN_ID: ${{ inputs.worker_run_id }}
          MAIN_CI_HEALTH_WORKER_ATTEMPT: ${{ inputs.worker_attempt }}
        run: node scripts/main-ci-health.mjs
      - name: Retain Main Health Observation
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: main-ci-health-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/main-ci-health.json
          retention-days: 30
          if-no-files-found: error
