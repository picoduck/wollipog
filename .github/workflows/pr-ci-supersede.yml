name: Stop Superseded Pull Request CI

# CI keys pull-request concurrency by head commit, so runs of one head never cancel each other
# (#3283). This cancels runs of a pull request's older heads once its current ready head is in
# progress. If it cannot, older-head CI simply runs to completion.
on:
  workflow_run:
    workflows: [CI]
    types: [in_progress]

# The workflow_run event executes trusted default-branch code. Never check out
# the triggering pull request or load its artifacts with this write-capable token.
permissions:
  contents: read
  pull-requests: read
  actions: write

concurrency:
  group: pr-ci-supersede-${{ github.event.workflow_run.id }}-${{ github.event.workflow_run.run_attempt }}
  cancel-in-progress: false

jobs:
  supersede:
    if: github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.repository.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Cancel CI Runs of Older Heads
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/pr-ci-supersede.mjs
