name: Stop Superseded Pull Request CI

# CI keys pull-request concurrency by head commit, so runs of one head never cancel each other
# (#3283). Queue cleanup when current-head CI is requested, before it gets a runner. Reruns do
# not emit requested, so retain in_progress for later attempts. Cleanup still needs a hosted
# runner; if it cannot act, older-head CI simply runs to completion.
on:
  workflow_run:
    workflows: [CI]
    types: [requested, in_progress]

# The workflow_run event executes trusted default-branch code. Never check out
# the triggering pull request or load its artifacts with this write-capable token.
permissions:
  contents: read
  pull-requests: read
  actions: write

concurrency:
  group: pr-ci-supersede-${{ github.event.workflow_run.id }}-${{ github.event.workflow_run.run_attempt }}
  cancel-in-progress: false

jobs:
  supersede:
    # Skip first-attempt in_progress at job admission, so it requests no second cleanup runner.
    if: github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.repository.full_name == github.repository && (github.event.action == 'requested' || github.event.workflow_run.run_attempt > 1)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Cancel CI Runs of Older Heads
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/pr-ci-supersede.mjs
