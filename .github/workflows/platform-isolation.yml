name: Platform Isolation

# These tests exercise OS-specific process isolation and spawning behavior. Run them
# only when the runner changes, or explicitly from the Actions page.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "apps/runner/**"
      - ".github/workflows/platform-isolation.yml"
  workflow_dispatch:
    inputs:
      linked_build_probe_only:
        description: "Linked Base Feasibility Only (Candidate; Not Released)"
        type: boolean
        default: false
        required: false

permissions:
  contents: read

concurrency:
  # A draft synchronize event can be delivered after ready_for_review. Keep stale
  # draft events in a separate lane so they cannot evict the runnable ready event.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ github.event_name == 'pull_request' && github.event.pull_request.draft && github.event.action != 'ready_for_review' && 'draft' || 'active' }}
  cancel-in-progress: true

jobs:
  platform-isolation:
    if: (github.event_name != 'workflow_dispatch' || inputs.linked_build_probe_only != true) && (github.event_name != 'pull_request' || github.event.action == 'ready_for_review' || github.event.pull_request.draft == false)
    name: Platform Isolation (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, windows-2025, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Setup Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify Native Isolation Adapter
        run: node --import tsx --test apps/runner/src/execution-isolation.test.ts apps/runner/src/runner-data-dir.test.ts apps/runner/src/spawn.test.ts

      - name: Verify Native Provider-HOME Lease Protocol
        run: node --import tsx --test apps/runner/src/provider-home-lease.test.ts apps/runner/src/provider-home-lease-portable.test.ts apps/runner/src/provider-home-lease-io.test.ts apps/runner/src/provider-home-lease-async.test.ts apps/runner/src/provider-home-lease-worker-protocol.test.ts apps/runner/src/provider-home-lease-heartbeat.test.ts

      - name: Verify Source Provider-HOME Worker
        run: node apps/runner/scripts/verify-provider-home-worker-binary.mjs --source

      - name: Verify Packaged Provider-HOME Worker
        shell: bash
        run: |
          pnpm --filter @wollipog/runner build:binary
          node apps/runner/scripts/verify-provider-home-worker-binary.mjs --packaged

      # The managed-worktree read-only rule and the hook-state mask (#1336) are only meaningful
      # against a real kernel mount, so this job installs bubblewrap and runs the enforcement tests
      # without their skip. A host that cannot create a user namespace would silently skip them,
      # which would report coverage nobody has.
      - name: Install Bubblewrap
        if: startsWith(matrix.os, 'ubuntu-')
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y bubblewrap

      - name: Verify Managed Worktree Sandbox Boundary
        if: startsWith(matrix.os, 'ubuntu-')
        shell: bash
        run: |
          set -euo pipefail
          bwrap --ro-bind / / --dev /dev --proc /proc --tmpfs /tmp --unshare-pid -- /bin/true
          output=$(node --import tsx --test --test-reporter=tap apps/runner/src/managed-worktree-sandbox.integration.test.ts apps/runner/src/managed-worktree-guard-sandbox.integration.test.ts < /dev/null)
          printf '%s\n' "$output"
          if printf '%s' "$output" | grep -q '^# skipped 0$'; then exit 0; fi
          echo "the bubblewrap enforcement test must run rather than skip on this job" >&2
          exit 1

      # Linux adoption moves files through the fixed renameat2(RENAME_NOREPLACE) helper, compiled
      # here from source, so its transaction, restore, and helper tests must run rather than skip.
      - name: Verify Native Linux Skill Adoption
        if: startsWith(matrix.os, 'ubuntu-')
        shell: bash
        run: |
          set -uo pipefail
          status=0
          output=$(node --import tsx --test --test-reporter=tap apps/runner/src/linux-skill-rename.test.ts apps/runner/src/skill-adoption.test.ts apps/runner/src/skill-adoption-recovery.test.ts < /dev/null) || status=$?
          printf '%s\n' "$output"
          if [ "$status" -ne 0 ]; then exit "$status"; fi
          if printf '%s' "$output" | grep -q '^# skipped 0$'; then exit 0; fi
          echo "the native Linux adoption tests must run rather than skip on this job" >&2
          exit 1

      # The Seatbelt half of the hook-state mask (#1336) can only run here, so it must not skip.
      - name: Verify Guard State Seatbelt Boundary
        if: matrix.os == 'macos-latest'
        shell: bash
        run: |
          set -euo pipefail
          output=$(node --import tsx --test --test-reporter=tap apps/runner/src/managed-worktree-guard-seatbelt.integration.test.ts < /dev/null)
          printf '%s\n' "$output"
          if printf '%s' "$output" | grep -q '^# skipped 0$'; then exit 0; fi
          echo "the Seatbelt hook-state test must run rather than skip on this job" >&2
          exit 1

      - name: Verify Native macOS Skill Filesystem Adapter
        if: matrix.os == 'macos-latest'
        run: node --import tsx --test apps/runner/src/macos-skill-snapshots.test.ts apps/runner/src/skill-snapshots.test.ts

      # Adoption writes into harness homes through the native helper, so its transaction and
      # recovery tests must execute against the real macOS helper rather than skip.
      - name: Verify Native macOS Skill Adoption
        if: matrix.os == 'macos-latest'
        shell: bash
        run: |
          set -uo pipefail
          status=0
          output=$(node --import tsx --test --test-reporter=tap apps/runner/src/macos-skill-adoption.test.ts apps/runner/src/skill-adoption-platform.test.ts < /dev/null) || status=$?
          printf '%s\n' "$output"
          if [ "$status" -ne 0 ]; then exit "$status"; fi
          if printf '%s' "$output" | grep -q '^# skipped 0$'; then exit 0; fi
          echo "the native macOS adoption tests must run rather than skip on this job" >&2
          exit 1

      # Discarding a kept-aside copy and restoring a library version delete user-edited store content
      # (#1725). Their safety rests on each platform's rename, unlink, hard-link, and symlink semantics,
      # so every case must execute here rather than skip.
      - name: Verify Kept-Aside Copy Removal
        if: matrix.os == 'macos-latest' || matrix.os == 'windows-latest'
        shell: bash
        run: |
          set -uo pipefail
          status=0
          output=$(node --import tsx --test --test-reporter=tap apps/runner/src/skill-kept-aside.test.ts apps/runner/src/skill-drift.test.ts < /dev/null) || status=$?
          printf '%s\n' "$output"
          if [ "$status" -ne 0 ]; then exit "$status"; fi
          if printf '%s' "$output" | grep -q '^# skipped 0$'; then exit 0; fi
          echo "the kept-aside removal tests must run rather than skip on this job" >&2
          exit 1

      - name: Verify Windows Orchestrator Harness
        if: startsWith(matrix.os, 'windows-')
        run: node --import tsx --test apps/runner/src/windows-cmd.test.ts apps/runner/src/context-command.test.ts apps/runner/src/discovery/resolve.test.ts apps/runner/src/discovery/claude-code.test.ts apps/runner/src/discovery/discover.test.ts apps/runner/src/discovery/harness-updates.test.ts apps/runner/src/orchestrator-preset.test.ts apps/runner/src/agent-control.test.ts apps/runner/src/agent-tui.test.ts

      - name: Verify Windows Release CLI Dispatch
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $env:TARGET_TRIPLE = 'x86_64-pc-windows-msvc'
          pnpm --filter @wollipog/runner build:binary
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node apps/runner/scripts/verify-cli-binary.mjs apps/runner/dist-bin/wollipog-runner-x86_64-pc-windows-msvc.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify Native Windows Skill Filesystem Adapters
        if: matrix.os == 'windows-latest'
        run: node --import tsx --test apps/runner/src/windows-skill-junction.test.ts apps/runner/src/windows-skill-snapshots.test.ts apps/runner/src/wsl-skill-snapshots.test.ts apps/runner/src/wsl-skills.test.ts apps/runner/src/skill-snapshots.test.ts

      - name: Verify Native Windows Skill Reconciliation
        if: matrix.os == 'windows-latest'
        run: node --import tsx --test --test-name-pattern="Windows uses junction-shaped" apps/runner/src/skills.test.ts

      # Adoption writes into harness homes through the native junction helper, so its transaction
      # and recovery tests must execute against real NTFS handles rather than skip.
      - name: Verify Native Windows Skill Adoption
        if: matrix.os == 'windows-latest'
        shell: bash
        run: |
          set -uo pipefail
          status=0
          output=$(node --import tsx --test --test-reporter=tap apps/runner/src/windows-skill-adoption.test.ts apps/runner/src/skill-adoption-platform.test.ts < /dev/null) || status=$?
          printf '%s\n' "$output"
          if [ "$status" -ne 0 ]; then exit "$status"; fi
          if printf '%s' "$output" | grep -q '^# skipped 0$'; then exit 0; fi
          echo "the native Windows adoption tests must run rather than skip on this job" >&2
          exit 1

      - name: Verify WSL Boundaries Stay Fail-Closed
        if: matrix.os == 'windows-2025'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          try {
            wsl.exe --install Ubuntu-24.04 --web-download --no-launch
            if ($LASTEXITCODE -ne 0) { throw "Ubuntu-24.04 WSL install failed" }
            wsl.exe -d Ubuntu-24.04 -u root --exec sh -c 'set -eu; apt-get update; DEBIAN_FRONTEND=noninteractive apt-get install -y bubblewrap build-essential curl xz-utils; archive=node-v24.18.1-linux-x64.tar.xz; cd /tmp; for attempt in 1 2 3 4; do curl --fail --location --silent --show-error --output "$archive" "https://nodejs.org/dist/v24.18.1/$archive" && break; test "$attempt" = 4 && exit 1; sleep 2; done; printf "%s  %s\n" d6c664df3f3f61458e8c277585571328522d705166723a7c7823a9253a4d15a0 "$archive" | sha256sum -c -; rm -rf /opt/wollipog-node; mkdir -p /opt/wollipog-node; tar --no-same-owner -xJf "$archive" -C /opt/wollipog-node --strip-components=1; test "$(/opt/wollipog-node/bin/node --version)" = v24.18.1; test "$(stat -c %u /opt/wollipog-node/bin/node)" = 0; rm -f "$archive"; id -u wollipog >/dev/null 2>&1 || useradd -m -s /bin/bash wollipog; printf ''[user]\ndefault=wollipog\n'' > /etc/wsl.conf'
            if ($LASTEXITCODE -ne 0) { throw "WSL boundary setup failed" }
            wsl.exe --terminate Ubuntu-24.04
            if ($LASTEXITCODE -ne 0) { throw "WSL termination failed" }

            $listing = (wsl.exe --list --verbose | Out-String) -replace "`0", ""
            if ($LASTEXITCODE -ne 0) { throw "WSL inventory query failed" }
            if ($listing -notmatch 'Ubuntu-24\.04\s+Stopped\s+2') { throw "Ubuntu-24.04 is not a stopped WSL2 distro: $listing" }
            $uid = ((wsl.exe -d Ubuntu-24.04 --exec id -u | Out-String) -replace "`0", "").Trim()
            if ($LASTEXITCODE -ne 0 -or $uid -eq "0" -or $uid -notmatch '^[0-9]+$') { throw "WSL default user is not non-root: $uid" }

            $env:WOLLIPOG_WSL_FAIL_CLOSED_DISTRO = "Ubuntu-24.04"
            $savedBoundaryPreference = $ErrorActionPreference
            $ErrorActionPreference = "Continue"
            $wslBoundaryOutput = node --import tsx --test --test-reporter=tap apps/runner/src/wsl-bwrap-fail-closed.integration.test.ts 2>&1 | Out-String
            $wslBoundaryExit = $LASTEXITCODE
            $ErrorActionPreference = $savedBoundaryPreference
            Write-Host $wslBoundaryOutput
            if ($wslBoundaryExit -ne 0) { throw "WSL Direct bwrap fail-closed integration test failed" }
            if ($wslBoundaryOutput -notmatch '(?m)^# pass 1\r?$' -or $wslBoundaryOutput -notmatch '(?m)^# skipped 0\r?$') {
              throw "WSL Direct bwrap integration test did not execute exactly once"
            }

            $env:WOLLIPOG_TEST_WSL_DISTRO = "Ubuntu-24.04"
            $env:WOLLIPOG_TEST_WSL_NODE = "/opt/wollipog-node/bin/node"
            $savedSkillsPreference = $ErrorActionPreference
            $ErrorActionPreference = "Continue"
            $wslSkillsOutput = node --import tsx --test --test-isolation=none --test-reporter=tap apps/runner/src/wsl-skills.wsl.test.ts 2>&1 | Out-String
            $wslSkillsExit = $LASTEXITCODE
            $ErrorActionPreference = $savedSkillsPreference
            Write-Host $wslSkillsOutput
            if ($wslSkillsExit -ne 0) { throw "real WSL managed-skills integration tests failed" }
            if ($wslSkillsOutput -notmatch '(?m)^# pass 3\r?$' -or $wslSkillsOutput -notmatch '(?m)^# skipped 0\r?$') {
              throw "real WSL managed-skills integration tests did not execute exactly three times"
            }

            $savedSafePreference = $ErrorActionPreference
            $ErrorActionPreference = "Continue"
            $safeWslOutput = node --import tsx --test --test-reporter=tap apps/runner/src/wsl-agent-control.wsl.test.ts 2>&1 | Out-String
            $safeWslExit = $LASTEXITCODE
            $ErrorActionPreference = $savedSafePreference
            Write-Host $safeWslOutput
            if ($safeWslExit -ne 0) { throw "safe Direct WSL Agent Control integration test failed" }
            if ($safeWslOutput -notmatch '(?m)^# pass 1\r?$' -or $safeWslOutput -notmatch '(?m)^# skipped 0\r?$') {
              throw "safe Direct WSL Agent Control integration test did not execute exactly once"
            }

            $cmdPath = ((wsl.exe -d Ubuntu-24.04 --exec sh -c 'command -v cmd.exe' | Out-String) -replace "`0", "").Trim()
            if ($LASTEXITCODE -ne 0 -or -not $cmdPath.StartsWith('/')) { throw "WSL Windows interop probe could not resolve cmd.exe: $cmdPath" }
            $savedPreference = $ErrorActionPreference
            $ErrorActionPreference = "Continue"
            # Hosted Windows images differ: some expose WSL's PE binfmt handler and some resolve
            # cmd.exe but reject it even outside bwrap. Record that host capability without making
            # it a prerequisite. The security invariant below is that the fresh provider /proc
            # never gains automatic PE/binfmt interop in either case. The read-only distro root
            # still contains /init, so this check deliberately makes no broader interop claim.
            $interopRegistration = ((wsl.exe -d Ubuntu-24.04 --exec sh -c 'if test -r /proc/sys/fs/binfmt_misc/WSLInterop; then printf present; else printf absent; fi' | Out-String) -replace "`0", "").Trim()
            $registrationExit = $LASTEXITCODE
            if ($registrationExit -ne 0) { throw "WSLInterop registration probe failed outside bwrap" }
            $outsideOutput = (wsl.exe -d Ubuntu-24.04 -- cmd.exe /d /c exit 0 2>&1 | Out-String) -replace "`0", ""
            $outsideExit = $LASTEXITCODE
            $outsideInterop = $outsideExit -eq 0
            if (-not $outsideInterop -and $outsideOutput -notmatch 'Exec format error') {
              throw "WSL Windows interop probe failed unexpectedly outside bwrap: $outsideOutput"
            }
            if (-not $outsideInterop) {
              Write-Host "::notice::Hosted WSL baseline lacks PE interop; verifying bwrap does not add it."
            }
            Write-Host "WSLInterop registration outside bwrap: $interopRegistration; cmd.exe executable outside bwrap: $outsideInterop"

            wsl.exe -d Ubuntu-24.04 --exec bwrap --die-with-parent --new-session --unshare-pid --unshare-ipc --unshare-uts --ro-bind / / --dev /dev --dir /dev/shm --proc /proc --tmpfs /tmp --chdir / -- /bin/true
            if ($LASTEXITCODE -ne 0) { throw "production-shaped bwrap smoke test failed" }
            wsl.exe -d Ubuntu-24.04 --exec bwrap --die-with-parent --new-session --unshare-pid --unshare-ipc --unshare-uts --ro-bind / / --dev /dev --dir /dev/shm --proc /proc --tmpfs /tmp --chdir / -- sh -c 'test ! -e /proc/sys/fs/binfmt_misc/WSLInterop'
            if ($LASTEXITCODE -ne 0) { throw "fresh bwrap /proc unexpectedly exposed the WSLInterop binfmt registration" }
            Write-Host "WSLInterop registration inside bwrap: absent"

            $blockedOutput = (wsl.exe -d Ubuntu-24.04 --exec bwrap --die-with-parent --new-session --unshare-pid --unshare-ipc --unshare-uts --ro-bind / / --dev /dev --dir /dev/shm --proc /proc --tmpfs /tmp --chdir / -- $cmdPath /d /c exit 0 2>&1 | Out-String) -replace "`0", ""
            $blockedExit = $LASTEXITCODE
            $ErrorActionPreference = $savedPreference
            if ($blockedExit -eq 0) { throw "bwrap unexpectedly preserved automatic PE/binfmt interop: $blockedOutput" }
            Write-Host "PE launch remained fail-closed inside bwrap (exit $blockedExit)."
          }
          finally {
            wsl.exe --unregister Ubuntu-24.04
          }

  linked-base-feasibility:
    if: github.event_name == 'workflow_dispatch' && inputs.linked_build_probe_only == true
    name: Linked Lease Base Feasibility (Linux x64)
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    permissions:
      contents: read
    steps:
      - name: One Guarded Linked Base Attempt
        shell: /usr/bin/python3.12 -I -B {0}
        env:
          WPLBF_CONTROLLER_WIRE_A: ''
          WPLBF_CONTROLLER_WIRE_B: ''
        run: |
          import time
          BOOTSTRAP_START = time.clock_gettime(time.CLOCK_BOOTTIME)
          import base64, hashlib, json, os, select, stat, sys, zlib
          CONTROLLER_ENTERED = False
          def refuse(reason):
              # No uncharged bootstrap record after entry into the owned controller.
              if CONTROLLER_ENTERED: raise SystemExit(1)
              b = json.dumps({'schema':'WPLBF-BOOTSTRAP3','result':'NO-GO','reason':reason,
                              'namespaceCreated':False,'sourceAcquired':False,
                              'allSixProductionACIncomplete':True},separators=(',',':')).encode()+b'\n'
              assert len(b)<=8192
              end=min(BOOTSTRAP_START+25,705.0,720.0)
              offset=0
              try:
                  os.set_blocking(1,False)
                  while offset<len(b):
                      stamp=time.clock_gettime(time.CLOCK_BOOTTIME)
                      if not 0<=stamp<end: break
                      _,ready,_=select.select([],[1],[],min(0.025,end-stamp))
                      if time.clock_gettime(time.CLOCK_BOOTTIME)>=end: break
                      if not ready: continue
                      try: n=os.write(1,b[offset:])
                      except BlockingIOError: continue
                      if type(n) is not int or not 0<n<=len(b)-offset: break
                      offset+=n
                      if time.clock_gettime(time.CLOCK_BOOTTIME)>=end: break
              except BaseException:
                  pass
              # Missing/partial terminal delivery is uncertainty, always NO-GO; no fallback.
              raise SystemExit(1)
          
          try:
              if not (0<=BOOTSTRAP_START<705): refuse('old boot; no new 720s origin')
              if sys.implementation.name!='cpython' or sys.version_info[:2]!=(3,12): refuse('interpreter ABI')
              # Same inherited time namespace as image PID1, zero offsets, no namespace setters.
              if os.stat('/proc/self/ns/time').st_ino!=os.stat('/proc/1/ns/time').st_ino: refuse('inherited time namespace')
              with open('/proc/self/timens_offsets') as f: offsets=f.read(4097)
              if len(offsets)>4096: refuse('clock-offset metadata cap')
              expected={'monotonic':['0','0'],'boottime':['0','0']}
              observed={}
              for line in offsets.splitlines():
                  parts=line.split()
                  if len(parts)!=3 or parts[0] in observed: refuse('clock-offset shape')
                  observed[parts[0]]=parts[1:]
              if observed!=expected: refuse('clock offset unproved/nonzero')
              if abs(time.clock_gettime(time.CLOCK_BOOTTIME)-time.monotonic())>=0.01: refuse('suspension/clock mismatch')
              h=hashlib.sha256()
              fd=os.open('/usr/bin/python3.12',os.O_RDONLY|os.O_NOFOLLOW|os.O_CLOEXEC)
              try:
                  s=os.fstat(fd)
                  if not (stat.S_ISREG(s.st_mode) and s.st_uid==0 and not s.st_mode&0o022 and s.st_size==8020928): refuse('Python preimage authority/size')
                  total=0
                  while total<s.st_size:
                      if time.clock_gettime(time.CLOCK_BOOTTIME)>=min(BOOTSTRAP_START+25,705): refuse('bootstrap/setup deadline')
                      b=os.read(fd,min(65536,s.st_size-total))
                      if not b: refuse('short Python preimage read')
                      h.update(b);total+=len(b)
                  if os.fstat(fd)!=s or h.hexdigest()!='e50d468e8b0adfb05733f5b87b3cff34829c4a8c1aea50c865aa8bdfe4bb150f': refuse('Python preimage mismatch')
              finally: os.close(fd)
              wire = os.environ.pop('WPLBF_CONTROLLER_WIRE_A') + os.environ.pop('WPLBF_CONTROLLER_WIRE_B')
              if len(wire)>45056: refuse('encoded controller cap')
              packed=base64.b64decode(wire,validate=True)
              if len(packed)>32768: refuse('compressed controller cap')
              decoder=zlib.decompressobj(31)
              source=decoder.decompress(packed,98305)
              if len(source)>98304 or decoder.unconsumed_tail or decoder.unused_data or not decoder.eof: refuse('decoded controller cap/framing')
              if len(source)!=74391 or hashlib.sha256(source).hexdigest()!='482ced08d009eeb28a36c90dc1e1af20c8db09b5c660d781e8d17b53d784b21a': refuse('controller preimage')
              if time.clock_gettime(time.CLOCK_BOOTTIME)>=min(BOOTSTRAP_START+25,705): refuse('bootstrap/setup exhausted')
              context={'head':'${{ github.sha }}','bootstrapStart':BOOTSTRAP_START,
                       'controllerSha256':'482ced08d009eeb28a36c90dc1e1af20c8db09b5c660d781e8d17b53d784b21a','clockOffset':0,
                       'runnerBoundary':'existing-public-ubuntu24-actions-vm'}
              namespace={'__name__':'__main__','HOSTED_CONTEXT':context}
              CONTROLLER_ENTERED = True
              exec(compile(source,'<reviewed-inline-WPLBF3>','exec'),namespace)
          except SystemExit:
              raise
          except BaseException as e:
              # Once the controller owns children, bootstrap cannot assert absence or emit
              # an extra uncharged terminal record. Missing terminal evidence is NO-GO.
              if CONTROLLER_ENTERED: raise SystemExit(1)
              refuse('bootstrap/controller failure: '+type(e).__name__)
