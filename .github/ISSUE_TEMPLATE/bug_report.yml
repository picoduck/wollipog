name: Bug Report
description: Report a reproducible problem in Wollipog
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve Wollipog. Do not include credentials, private transcripts, proprietary code, or vulnerability details. Report security issues through SECURITY.md.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Summarize the user-visible failure and its impact.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction Steps
      description: Provide the smallest reliable sequence that reproduces the problem.
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: Describe what you observed, including sanitized error text.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: Describe the intended outcome.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Wollipog Version
      placeholder: v0.18.0 or commit SHA
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Operating system, architecture, browser or desktop app, and runner context.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Sanitized Evidence
      description: Include minimal logs, screenshots, or code references. Remove tokens, paths, hostnames, personal data, prompts, and private repository content.
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance Criteria
      description: List the externally verifiable conditions that demonstrate the problem is fixed.
      placeholder: "- [ ] The reported workflow completes without the failure."
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Submission Checks
      options:
        - label: I searched for an existing issue.
          required: true
        - label: I removed credentials and private information.
          required: true
        - label: This is not a security vulnerability.
          required: true