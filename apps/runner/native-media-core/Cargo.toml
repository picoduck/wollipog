[package]
name = "wollipog-native-media-core"
version = "0.1.0"
edition = "2024"
publish = false

# Separate source identity. This is not the installed Codex App Server or a runtime driver.
[workspace]

[features]
default = []
native-core = ["dep:codex-core", "dep:codex-extension-api", "dep:codex-protocol", "dep:serde_json"]

[dependencies]
codex-core = { git = "https://github.com/openai/codex", rev = "092d3acd6bec3e3a14bdc7e7a2810ab628ab759d", optional = true }
codex-extension-api = { git = "https://github.com/openai/codex", rev = "092d3acd6bec3e3a14bdc7e7a2810ab628ab759d", optional = true }
codex-protocol = { git = "https://github.com/openai/codex", rev = "092d3acd6bec3e3a14bdc7e7a2810ab628ab759d", optional = true }
serde_json = { version = "1", optional = true }

# Cargo does not inherit a dependency workspace's patches. Preserve the exact public
# overrides in the pinned SDK workspace; do not drop its required proxy feature.
[patch.crates-io]
crossterm = { git = "https://github.com/openai-oss-forks/crossterm", rev = "ed1cdab335221515706178d68495bba2aed1924f" }
tokio-tungstenite = { git = "https://github.com/openai-oss-forks/tokio-tungstenite", rev = "0e5b2d73aa18dd9f0a50ee9ff199d5aef7594186" }
tungstenite = { git = "https://github.com/openai-oss-forks/tungstenite-rs", rev = "4fffad30fe373adbdcffab9545e9e9bf4f2fc19f" }

[patch."ssh://git@github.com/openai-oss-forks/tungstenite-rs.git"]
tungstenite = { git = "https://github.com/openai-oss-forks/tungstenite-rs", rev = "4fffad30fe373adbdcffab9545e9e9bf4f2fc19f" }
