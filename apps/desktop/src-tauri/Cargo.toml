[package]
name = "wollipog-desktop"
version = "0.21.0"
description = "Wollipog desktop shell"
license = "Apache-2.0"
repository = "https://github.com/picoduck/wollipog"
homepage = "https://github.com/picoduck/wollipog"
edition = "2021"
rust-version = "1.88"

# The library is what Tauri's mobile targets link against; the binary (main.rs)
# just calls into it. Keep both so `tauri dev`/`build` work on desktop today and
# mobile later without restructuring.
[lib]
name = "wollipog_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
# §23.2 window geometry is not persisted; §23.4 a second launch races the first for the
# sidecar port and the settings file.
tauri-plugin-window-state = "2"

atomic-write-file = "0.2.3"
base64 = "0.22.1"
chrono = { version = "0.4.42", default-features = false, features = ["clock"] }
futures-util = "0.3.31"
getrandom = "0.3.4"
hmac = "0.12.1"
keyring = { version = "4.1.5", default-features = false, features = ["v1"] }
libc = "0.2"
memchr = "2.7.6"
reqwest = { version = "0.13.4", default-features = false, features = ["json", "stream", "native-tls"] }
same-file = "1.0.6"
secrecy = "0.10.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10.9"
tokio = { version = "1.48.0", features = ["macros", "net", "sync", "time"] }
tokio-tungstenite = { version = "0.26.2", default-features = false, features = ["connect", "native-tls"] }
url = "2.5.7"
uuid = { version = "1.18.1", features = ["v4"] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true

# §23.4. Desktop only: a second launch would race the first for the sidecar port and the
# settings file. Mobile has no concept of a second process to guard against.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
dirs = "6"
fs2 = "0.4.3"
tauri-plugin-single-instance = "2"
