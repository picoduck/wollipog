packages:
  - "apps/*"
  - "packages/*"

# pnpm 11 reads engine enforcement here instead of .npmrc.
engineStrict: true

# concurrently pins the same shell parser; keep its runtime on the patched release too.
overrides:
  "concurrently@10.0.5>shell-quote": 1.11.0

# esbuild's postinstall links the platform-native binary used by tsx and vite.
# pnpm blocks dependency build scripts by default; this environment gates them
# through the allowBuilds field.
allowBuilds:
  esbuild: true
  # node-pty 1.1 publishes signed-package prebuilds for supported platforms. The runner loads the
  # exact prebuild as a SEA asset, so its install scripts are unnecessary and stay disabled.
  node-pty: false
